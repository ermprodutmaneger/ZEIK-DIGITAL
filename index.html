      ["Só você vê a base", "Em <b>Configurações → Proteção do painel</b>: ative um PIN de 4–8 dígitos e ligue <b>Travar a tela após X min</b> (5 min é bom). Os dados ficam no <i>localStorage</i> do aparelho: não sobem pra servidor nenhum, não tem login de terceiros.", []],
      ["Levar a base pro iPad (e de volta)", "<b>Configurações → base privada → Exportar base privada (.json)</b>. Salve no seu Drive/iCloud. No outro aparelho: <b>Carregar do arquivo</b>. Não mande esse arquivo por WhatsApp pra ninguém.", []]]],
    ["1 · Público: escolher a cidade pequena certa", [
      ["O alvo", "Negócio de bairro em cidade de 8 a 60 mil habitantes: barbearia, salão, estética, pet shop, ótica, auto, material de construção, pizzaria. Eles têm qualidade e não têm página.", []],
      ["Onde achar (grátis, 4 min por cidade)", "<a href='https://www.fresha.com/lp/pt/bt/barbearias/br-são-paulo' target='_blank' rel='noopener'>Fresha (salões e barbearias)</a> mostra telefone no bloco “Ligar para fazer reserva”. <a href='https://www.google.com/maps' target='_blank' rel='noopener'>Google Maps</a> mostra endereço e telefone em qualquer nicho. Copie nome, endereço e telefone.", []],
      ["Trazer pro painel", "<b>🧰 Coletor</b> (no topo da Prospecção ou do Disparo) → cole uma empresa por linha → olhe a prévia → <b>Importar pra base</b>. Ele separa celular de fixo sozinho e não duplica quem já existe.", []],
      ["Checar se ele já tem site", "Busque “<span class='mono'>nome da empresa + cidade</span>” no Google. Sem site = venda fácil. Só Linktree/Instagram = venda média. Site bonito = próximo lead.", []]]],
    ["2 · Modelo: escrever o seu roteiro (não o meu)", [
      ["Abrir o editor", "<b>Disparo → ✍️ Modelar roteiros</b> (ou Scripts → Modelar meus roteiros). Cinco caixas: 1ª mensagem, gatilho, reunião, no-show, follow-up.", []],
      ["Usar as variáveis", "Aperte nos chips (<span class='mono'>{{empresa}}</span>, <span class='mono'>{{contato}}</span>, <span class='mono'>{{bairro}}</span>, <span class='mono'>{{valorZeik}}</span>, <span class='mono'>{{doisHorarios}}</span>…). O painel troca pelo dado de cada lead na hora de mandar.", []],
      ["A regra do preço", "Em <b>Política de preço</b> deixe <b>“só quando ele perguntar”</b>. A abertura fala do negócio dele (quantos clientes novos pagam o site), não da sua tabela. A faixa entra no fechamento e na proposta.", []],
      ["Ouvir antes de mandar", "<b>🔊 Ouvir</b> em cada caixa (e em todo card da fila). Em <b>Configurações → 🔊 O painel fala com você</b>, escolha a voz e a velocidade. No iPhone: baixe a voz <b>Português (Brasil)</b> em Ajustes → Acessibilidade → Conteúdo Falado.", []]]],
    ["3 · Disparo: volume com cadência (é aqui que a maioria quebra o número)", [
      ["Montar a fila", "<b>Disparo → 🎯 Nova fila</b>. Escolha região/cidade/segmento, o tamanho da fila e a cadência. O painel ordena por score (quem tem celular, sem site, prioridade alta vem primeiro).", []],
      ["O ritmo", "4 a 8 minutos entre mensagens, pausa de 10 a 20 a cada 10 leads, no máximo <b>40 leads/dia</b> (ajusta em Configurações). O cronômetro aparece no topo da tela — enquanto ele conta, <b>não mande</b>.", []],
      ["Mandar de verdade", "Botão <b>💬 Abrir WhatsApp com a 1ª</b>: abre a conversa do lead com o texto pronto (você dá a última olhada e aperta enviar). O painel marca “enviado” e liga o cronômetro.", []],
      ["Se você quiser API mesmo", "Isso é contratar um gateway: <a href='https://doc.evolution-api.com' target='_blank' rel='noopener'>Evolution API</a> (self-hosted), <a href='https://z-api.com.br' target='_blank' rel='noopener'>Z-API</a> (paga, BR) ou <a href='https://developers.facebook.com/docs/whatsapp/cloud-api' target='_blank' rel='noopener'>Meta Cloud API</a> (oficial, cobra por conversa, precisa de aprovação de mensagem). Você cola a URL em <b>Disparo → Conector de API</b> e o painel passa a usar sua fila. <b>Enquanto estiver desligado, nada é enviado sozinho</b> — é o modo seguro.", []]]],
    ["4 · Resposta: a 2ª mensagem é gatilho, não é insistência", [
      ["Caiu na automática", "Ele respondeu “estou em atendimento, me diga o que precisa”? Isso é a mensagem automática do balcão. Marque <b>💬 Respondeu</b> no card: o painel copia o <b>gatilho</b> e te mostra. Manda na hora — é mais curto, mais direto e com o link da prévia.", []],
      ["Respondeu de verdade", "Perguntou preço? Fale da faixa e do que está incluso (1ª página, Google, botão de WhatsApp, prazo). Pediu pra pensar? Manda o <b>modelo pronto</b> (botão 🧪 Prévia do site baixa o HTML — abra no celular e mande print ou arquivo).", []],
      ["Sem WhatsApp", "<b>✖ Sem WhatsApp</b> no card: o painel limpa o lead e te manda caçar o celular. Número fixo nunca recebe mensagem de venda.", []]]],
    ["5 · Reunião: é isso que conta no dia", [
      ["Fechamento de agenda", "Botão <b>📅 Reunião</b>: o lead vira negociação no Kanban com os dados já preenchidos. O roteiro usa <span class='mono'>{{doisHorarios}}</span> — “amanhã 10h ou quinta 15h?” fecha 3x mais que “quando puder”. ", []],
      ["Meta real", "3 a 6 reuniões por dia, não 200 mensagens. Se a fila anda e ninguém marca reunião, o problema é o gancho da 1ª mensagem (volte ao passo 2) — não o volume.", []],
      ["Ele sumiu", "<b>📄 Relatório → Criar follow-up de quem não respondeu</b> cria tarefa pra amanhã, uma mensagem só. Depois disso, a pessoa sai da sua frente e entra na lista do mês que vem.", []]]],
    ["Pós · Relatório, cobrança e limpeza", [
      ["Ler o que aconteceu", "<b>Disparo → 📄 Relatório</b>: taxa de resposta por cidade e por segmento, melhor horário de envio e quantos números eram inválidos. Baixe o CSV quando quiser comparar semanas.", []],
      ["Colar o resultado da API", "Se você disparou por gateway, use <b>⬆ Colar resultado do gateway</b> (linhas <span class='mono'>número;status</span>). O painel marca enviado/falha na base — sem backend no meio.", []],
      ["Cobrar sem depender de ninguém", "<b>💸 Gerar cobrança</b>: monta o <b>PIX copia-e-cola</b> (BR Code, com CRC calculado no seu navegador) e o QR. Ou use o <b>link do Mercado Pago</b>: no app MP → <i>Receber dinheiro → Criar link de pagamento</i> → cole o <span class='mono'>mpago.la/…</span> em Configurações. Cartão, boleto e PIX caem na sua conta; o painel lança como “a receber”.", []],
      ["Fechar no Google", "Depois do sim: <a href='https://business.google.com' target='_blank' rel='noopener'>Google Meu Negócio</a> do cliente apontando pro site publicado. É o que faz o site trabalhar — e o que justifica a manutenção mensal.", []]]],
    ["Se der ruim (os 4 erros que matam a operação)", [
      ["Número bloqueado", "Pare de mandar por 48h. Reduza para 20/dia, troque a 1ª mensagem (nada de “olá, tudo bem? trabalho com sites”) e não mande link na primeira mensagem de um número novo.", []],
      ["Perdeu os leads", "Backup semanal: <b>Configurações → ⬇ Baixar backup .json</b>. Limpar dados do navegador ou desinstalar o app apaga o que está salvo nele.", []],
      ["Mensagem copiada e igual pra todo mundo", "O lojista reconhece em 1 segundo. Use o card do lead: o painel já troca nome, bairro e o ângulo; você muda a primeira linha.", []],
      ["Falar de preço antes de mostrar o modelo", "Perde venda e queima a confiança. Mostre a prévia primeiro; preço na reunião e na proposta.", []]]]
  ];
  App.modalEnsinar = function () {
    var corpo = ENSINO.map(function (sec, i) {
      return '<div class="card-flat" style="padding:12px 14px;margin-bottom:10px"><div class="card-title" style="font-size:13.5px">' + esc(sec[0]) + "</div>" +
        sec[1].map(function (p) {
          var ligs = (p[2] || []).map(function (l) {
            return '<button class="btn xs ghost" data-act="jump" data-view="' + l[1].replace("#/", "") + '">' + esc(l[0]) + "</button>";
          }).join(" ");
          return '<div style="padding:7px 0;border-top:1px solid var(--hairline)">' +
            '<div class="row wrap" style="gap:8px;align-items:baseline"><b class="tiny">' + esc(p[0]) + "</b>" + (ligs ? '<span class="row wrap" style="gap:5px;margin-left:auto">' + ligs + "</span>" : "") + "</div>" +
            '<p class="tiny" style="margin:3px 0 0">' + p[1] + "</p></div>";
        }).join("") + "</div>";
    }).join("");
    U.openModal(U.modalShell("🎓 Como usar o painel (o curso em 8 passos)",
      "Do print do WhatsApp ao PIX na conta. Cada linha é um clique — nada aqui depende de programador, servidor ou mensalidade.",
      '<div class="callout" style="margin-bottom:12px">🧠 <b>A tese do Whats Ouro, no seu painel:</b> disparo em massa <b>não</b> é abordagem. Venda é volume <i>filtrado</i>: poucos leads certos, mensagem boa, cadência que não queima o número e reunião como única métrica que importa. O resto é ruído.</div>' +
      corpo + '<p class="tiny">Fontes públicas usadas na coleta (Fresha, Google Maps, diretórios): confirme nome, número e endereço na primeira mensagem — dado velho é o principal motivo de “não é meu número”.</p>',
      '<button class="btn quiet" data-close>Fechar</button>' +
      '<button class="btn ghost" data-act="ensinar-copiar">⧉ Copiar o passo a passo</button>' +
      '<button class="btn" data-act="ensinar-baixar">⬇ Salvar .md no aparelho</button>'), { wide: true });
  };
  function textoEnsino() {
    return "# ZEIK DIGITAL — como usar o painel (passo a passo)\n\n" + ENSINO.map(function (sec) {
      return "\n## " + sec[0] + "\n" + sec[1].map(function (p) { return "- **" + p[0] + "** — " + String(p[1]).replace(/<[^>]+>/g, "").replace(/\n/g, " "); }).join("\n");
    }).join("\n") + "\n\n> Meta: 150 empresas mapeadas por região · 3 a 6 reuniões por dia · 40 mensagens/dia no máximo, com cadência.\n";
  }
  App.handlers["ensinar-copiar"] = function () { U.copy(textoEnsino(), "Passo a passo copiado (o HTML interno virou texto limpo)."); };
  App.handlers["ensinar-baixar"] = function () { U.download("zeik-como-usar.md", textoEnsino(), "text/markdown;charset=utf-8"); U.toast("Arquivo salvo — dá pra abrir no celular e editar.", "ok"); };

  U.__celebrate = function () {
    var n = 26, html = "";
    for (var i = 0; i < n; i++) {
      var x = Math.random() * 100, delay = (Math.random() * 0.5).toFixed(2), c = ["#0071e3", "#34c759", "#ff9500", "#5856d6", "#af52de"][i % 5];
      html += '<span style="position:fixed;left:' + x + 'vw;top:-10px;width:7px;height:12px;background:' + c + ';border-radius:2px;z-index:400;pointer-events:none;animation:fall 2.6s ' + delay + 's linear forwards"></span>';
    }
    var stl = document.createElement("style");
    stl.textContent = "@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.15}}";
    document.head.appendChild(stl);
    document.body.insertAdjacentHTML("beforeend", html);
    setTimeout(function () { document.querySelectorAll("[style*='fall']").forEach(function (e) { }); stl.remove(); }, 100);
    setTimeout(function () {
      document.querySelectorAll("body > span").forEach(function (el) { if (el.style.animation && el.style.animation.indexOf("fall") >= 0) el.remove(); });
    }, 3400);
  };
})();

</script>
