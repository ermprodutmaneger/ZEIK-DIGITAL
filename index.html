    }
  };
  App.renderSearchActive = function () {
    var i = document.querySelector("[data-filter=search]");
    if (i && i.value !== App.filters.q) i.value = App.filters.q;
  };

  function topbar(title, sub, actions) {
    return '<div class="topbar"><div><h1>' + esc(title) + '</h1><div class="sub">' + sub + '</div></div>' +
      '<div class="topbar-actions">' + (actions || "") + '</div></div>';
  }

  /* ====================================================================== */
  /*  DASHBOARD                                                              */
  /* ====================================================================== */
  function viewDashboard() {
    var S = window.ZeikStore, s = st(), m = S.stats(), cfg = s.config;
    var hoje = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

    var kpis = [
      ["Prospects na lista", m.prospects, "blue", m.prospectNovos + " ainda não contatados", 0],
      ["Em negociação", m.emNegociacao, "cyan", m.propostas + " proposta(s) enviada(s)", 0],
      ["Ganhos (mês)", m.sitesMes, "green", m.ganhos + " no total · taxa " + m.taxa + "%", 0],
      ["Faturado no mês", m.totalMes, "indigo", (m.totalMes >= m.totalMesAnterior ? "▲ " : "▼ ") + money(Math.abs(m.totalMes - m.totalMesAnterior)) + " vs mês passado", 1],
      ["A receber", m.aReceber, "orange", s.financeiro.filter(function (f) { return f.status === "a_receber"; }).length + " lançamento(s)", 1],
      ["MRR (manutenções)", m.mrr, "purple", m.comManut + " cliente(s) a " + money(cfg.manutMes) + "/mês", 1],
      ["Prontos p/ WhatsApp", m.comWhats, "green", m.soFixo + " só com fixo · " + m.semContato + " sem número", 0]
    ].map(function (k) {
      return '<div class="card kpi accent-' + k[2] + ' hoverable"><div class="label">' + k[0] + '</div><div class="value">' +
        (k[4] ? money(k[1]) : k[1]) + '</div><div class="delta">' + esc(k[3]) + '</div></div>';
    }).join("");

    /* gráfico 6 meses */
    var max = Math.max.apply(null, m.porMes.map(function (x) { return Math.max(x.pago, x.receber); }).concat([1]));
    var chart = m.porMes.map(function (x, i) {
      var last = i === m.porMes.length - 1;
      var h = Math.round((x.pago / max) * 118) + 3;
      var hr = Math.round((x.receber / max) * 118);
      return '<div class="bar-wrap" title="' + x.label + ": " + money(x.pago) + ' recebido • ' + money(x.receber) + ' a receber">' +
        '<div class="bar-val">' + (x.pago ? (x.pago >= 1000 ? (x.pago / 1000).toFixed(1).replace(".0", "") + "k" : x.pago) : "") + '</div>' +
        '<div style="width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;height:126px;gap:3px">' +
        (x.receber ? '<div style="height:' + Math.max(hr, 3) + 'px;border-radius:8px 8px 4px 4px;background:rgba(255,149,0,.45)" title="A receber"></div>' : "") +
        '<div class="bar' + (last ? " current" : "") + '" style="height:' + h + 'px"></div></div>' +
        '<div class="bar-lbl">' + esc(x.label) + '</div></div>';
    }).join("");

    /* meta */
    var pctMeta = Math.min(100, Math.round((m.sitesMes / (cfg.metaSitesMes || 1)) * 100));
    var faltam = Math.max(0, (cfg.metaSitesMes || 0) - m.sitesMes);

    /* funil */
    var etps = ["lead", "contatado", "proposta", "ganho"];
    var fun = etps.map(function (e) {
      var n = s.deals.filter(function (d) { return d.etapa === e; }).length;
      return { nome: S.Etapas[e].nome, n: n };
    });
    var maxFun = Math.max.apply(null, fun.map(function (x) { return x.n; }).concat([1]));
    var funil = fun.map(function (x, i) {
      return '<div class="hbar"><span>' + esc(x.nome) + '</span><span class="track"><i style="width:' + Math.round((x.n / maxFun) * 100) + '%;background:' +
        ["var(--text-3)", "var(--blue)", "var(--orange)", "var(--green)"][i] + '"></i></span><span class="n">' + x.n + '</span></div>';
    }).join("");

    /* segmentos */
    var maxSeg = Math.max.apply(null, m.porSegmento.map(function (x) { return x.n; }).concat([1]));
    var segs = m.porSegmento.slice(0, 8).map(function (x) {
      var sg = seg(x.id);
      return '<div class="hbar"><span class="truncate">' + esc((sg.emoji || "") + " " + sg.nome) + '</span>' +
        '<span class="track"><i style="width:' + Math.round((x.n / maxSeg) * 100) + '%"></i></span><span class="n">' + x.n + '</span></div>';
    }).join("") || '<p class="tiny">Sem dados ainda.</p>';

    /* cobertura por zona (SP inteira) */
    var maxZona = Math.max.apply(null, m.porZona.map(function (x) { return x.n; }).concat([1]));
    var zonasHtml = m.porZona.map(function (x) {
      return '<div class="hbar"><span class="truncate">' + esc(x.emoji + " " + x.nome) + '</span>' +
        '<span class="track"><i style="width:' + Math.round((x.n / maxZona) * 100) + '%;background:' + (x.whats ? "var(--green)" : "var(--text-3)") + '"></i></span>' +
        '<span class="n" title="' + x.whats + ' com celular de ' + x.n + '">' + x.n + '</span></div>';
    }).join("");

    /* próximas ações */
    var prox = s.tarefas.filter(function (t) { return !t.concluida; })
      .sort(function (a, b) { return (a.data || "9999") < (b.data || "9999") ? -1 : 1; }).slice(0, 6);
    var proxHtml = prox.length ? prox.map(function (t) {
      var d = Z.diasAteData(t.data);
      var label = d < 0 ? ("atrasada " + Math.abs(d) + "d") : d === 0 ? "hoje" : d === 1 ? "amanhã" : "em " + d + " dias";
      return '<div class="li" style="padding:10px 12px"><div class="li-seg" style="background:rgba(0,113,227,.10)">⏰</div>' +
        '<div class="li-lead"><div class="li-title" style="font-size:13.5px">' + esc(t.titulo) + '</div>' +
        '<div class="li-meta">' + (t.cliente ? esc(t.cliente) + ' · ' : '') + '<span class="badge ' + (d < 0 ? "red" : d === 0 ? "orange" : "blue") + '">' + label + '</span></div></div>' +
        '<div class="li-actions"><button class="btn xs quiet" data-act="tarefa-concluir" data-id="' + t.id + '">✓ Feito</button>' +
        '<button class="btn xs ghost" data-act="tarefa-editar" data-id="' + t.id + '">✏️</button></div></div>';
    }).join("") : '<p class="tiny">Nenhuma tarefa pendente. Use "Agendar follow-up" no Kanban para criar uma.</p>';

    /* quem precisa de atenção (calor do funil de prospecção) */
    var quentes = s.prospects.filter(function (p) { return p.status === "respondeu" || p.status === "Orcamento"; });
    var esfriando = s.prospects.filter(function (p) { return p.status === "contato_feito" && (Z.diasDesde(p.ultimoContato || p.atualizadoEm) || 0) >= 4; });

    var cam = S.campanha();
    var enviadosHoje = cam ? (cam.enviadosHoje || 0) : 0;
    var reunioesHoje = s.prospects.filter(function (p) {
      return p.status === "convertido" && p.ultimoContato && p.ultimoContato.slice(0, 10) === Z.todayISO();
    }).length;
    var rotina = '<div class="card" style="margin-bottom:14px"><div class="card-title">🔁 Rotina do dia (o ciclo do curso, na ordem)</div>' +
      '<div class="row wrap" style="gap:6px">' +
      '<button class="btn sm" data-act="campanha-nova">🎯 1 · Montar a fila' + (cam ? " (" + (cam.itens.length - cam.itens.filter(function (x) { return x.estado === "na fila"; }).length) + "/" + cam.itens.length + ")" : "") + '</button>' +
      '<button class="btn sm ghost" data-act="jump-disparo">📣 2 · Disparar no ritmo</button>' +
      '<button class="btn sm ghost" data-act="coletor-abrir">🧰 3 · Coletar dados novos</button>' +
      '<button class="btn sm ghost" data-act="cobrar-abrir">💸 4 · Cobrar (PIX/link)</button>' +
      '<button class="btn sm quiet" data-act="ensinar">🎓 Como usar (passo a passo)</button>' +
      '</div><div class="row wrap" style="margin-top:8px;gap:8px">' +
      '<span class="badge ' + (enviadosHoje >= (cfg.limiteDisparoDia || 40) ? "orange" : "blue") + '">mensagens hoje: ' + enviadosHoje + "/" + (cfg.limiteDisparoDia || 40) + '</span>' +
      '<span class="badge ' + (reunioesHoje >= 3 ? "green" : "gray") + '">reuniões hoje: ' + reunioesHoje + " · meta 3 a 6</span>" +
      '<span class="badge gray">regras: 1 mensagem boa por lead, gatilho só depois da automática, follow-up único</span>' +
      '</div></div>';
    return topbar(
      ui().saudacao() + ", " + (cfg.responsavel || "chefe").split(" ")[0] + " 👋",
      hoje + " · " + esc(cfg.cidade) + " · " + m.prospects + " empresas mapeadas (" + s.prospects.filter(function (p) { return p.zona === "Interior"; }).length + " de cidade pequena)",
      '<button class="btn sm ghost" data-act="export-backup">⬇ Backup</button>' +
      '<button class="btn sm ghost" data-act="ensinar">🎓 Como usar</button>' +
      '<button class="btn sm" data-act="novo-prospect">+ Novo prospect</button>'
    ) + rotina +
      '<div class="grid kpis k6" style="margin-bottom:14px">' + kpis + '</div>' +
      (m.soFixo + m.semContato ? '<div class="callout" style="margin-bottom:14px">☎️ <b>' + (m.soFixo + m.semContato) + ' cadastros ainda não têm celular.</b> ' +
        'Eles ficam fora da fila de WhatsApp de propósito: número fixo (2xxx, 3xxx, 4xxx, 5xxx) não abre conversa. ' +
        'Abra o <b>🗺️ Pegar celular</b> neles e o lead entra na fila na hora. ' +
        '<button class="btn xs" data-act="jump" data-view="prospeccao" data-query="canal=ligar">ver os que só têm fixo →</button></div>' : '') +
      '<div class="grid side" style="margin-bottom:14px">' +
      '<div class="card"><div class="card-title">📈 Faturamento dos últimos 6 meses <span class="tiny" style="margin-left:auto">laranja = a receber · verde = mês atual</span></div>' +
      '<div class="chart">' + chart + '</div>' +
      '<hr class="hr"><div class="row" style="gap:22px;flex-wrap:wrap">' +
      kv("Recebido no ano", money(s.financeiro.filter(function (f) { return f.status === "pago" && f.mes && f.mes.slice(0, 4) === String(new Date().getFullYear()); }).reduce(function (a, f) { return a + Number(f.valor || 0); }, 0))) +
      kv("Ticket médio", money(m.ticket)) +
      kv("Sites entregues", String(s.deals.filter(function (d) { return d.etapa === "ganho"; }).length)) +
      kv("Clientes ativos", String(m.clientesAtivos)) +
      '</div></div>' +
      '<div class="col">' +
      '<div class="card"><div class="card-title">🎯 Meta do mês — ' + esc(cfg.metaSitesMes) + ' sites</div>' +
      '<div class="row" style="gap:14px"><div style="font-size:34px;font-weight:600;letter-spacing:-.03em">' + m.sitesMes + '<span style="font-size:15px;color:var(--text-3)">/' + esc(cfg.metaSitesMes) + '</span></div>' +
      '<div class="grow"><div class="prog ' + (pctMeta >= 100 ? "green" : pctMeta >= 50 ? "" : "orange") + '"><i style="width:' + pctMeta + '%"></i></div>' +
      '<p class="tiny" style="margin:6px 0 0">' + (faltam ? "Faltam " + faltam + " pra bater a meta · " + (faltam * Math.max(1, Math.round(m.prospects / 6))) + " abordagens no mínimo" : "Meta batida! 🎉") + '</p></div></div></div>' +
      '<div class="card"><div class="card-title">🔥 Precisa de você hoje</div><div class="col" style="gap:8px">' +
      mini('Respondeu e não recebeu proposta', quentes.length, 'prospeccao', 'status=respondeu', "orange") +
      mini('Contato esfriando (4+ dias)', esfriando.length, 'prospeccao', 'status=contato_feito', "red") +
      mini('Sem site (venda fácil)', m.semSite, 'prospeccao', 'need=site', "blue") +
      mini('Sem Instagram (combo)', m.semInsta, 'prospeccao', 'need=insta', "purple") +
      mini('Instagram a conferir no Maps', m.instaAConferir, 'prospeccao', 'need=insta2', "gray") +
      mini('📍 No meu raio', st().prospects.filter(function (p) { return Z.ehRaio(p, st().config); }).length, 'prospeccao', 'raio=dentro', "cyan") +
      mini('✅ Na fila: têm WhatsApp', m.comWhats, 'prospeccao', 'canal=wa', "green") +
      mini('☎️ Só fixo — pegar celular', m.soFixo, 'prospeccao', 'canal=ligar', "orange") +
      '</div></div>' +
      '</div></div>' +

      '<div class="grid three" style="margin-bottom:14px">' +
      '<div class="card"><div class="card-title">🪜 Funil de negociação</div>' + funil +
      '<p class="tiny" style="margin:10px 0 0">Conversão ganho/(ganho+perdido): <b>' + m.taxa + '%</b> · valor em pipeline: <b>' + money(m.pipeline) + '</b></p></div>' +
      '<div class="card"><div class="card-title">🧬 Sua lista por segmento</div><div class="hbars">' + segs + '</div>' +
      '<div class="card-title" style="margin-top:14px">🗺️ Cobertura por zona <span class="tiny" style="margin-left:auto">verde = com celular</span></div>' +
      '<div class="hbars">' + zonasHtml + '</div></div>' +
      lucroCard() +
      '</div>' +

      '<div class="card"><div class="card-title">⏰ Próximas ações</div><div class="list">' + proxHtml + '</div></div>';
  }

  function kv(k, v) { return '<div><div class="tiny">' + esc(k) + '</div><div style="font-weight:600;letter-spacing:-.01em">' + v + '</div></div>'; }
  function mini(label, n, view, query, color) {
    return '<button class="row between jumpbtn" data-act="jump" data-view="' + view + '" data-query="' + query + '" ' +
      'style="width:100%;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:8px 10px;border-radius:12px;text-align:left">' +
      '<span style="font-size:13px">' + esc(label) + '</span><span class="badge ' + color + '">' + n + '</span></button>';
  }

  function lucroCard() {
    var s = st(), cfg = s.config, S = window.ZeikStore;
    var ativos = s.clientes.filter(function (c) { return c.status === "ativo"; });
    var comManut = ativos.filter(function (c) { return c.manutencao; }).length;
    var mrr = comManut * cfg.manutMes;
    var v = App.lucro = App.lucro || { sites: 4, preco: cfg.precoSite, manut: comManut, custo: cfg.custoFixoMes };
    var receita = v.sites * v.preco + mrr;
    var lucro = receita - v.custo;
    var breakEven = v.preco > 0 ? Math.ceil(v.custo / v.preco) : 0;
    return '<div class="card"><div class="card-title">💹 Calculadora de lucro (recorrência incluída)</div>' +
      '<div class="col" style="gap:9px">' +
      slider("sites", "Sites no mês", v.sites, 0, 20, 1) +
      slider("preco", "Preço médio do site", v.preco, 300, 1500, 50, true) +
      slider("custo", "Custo fixo do mês", v.custo, 0, 3000, 50, true) +
      '</div><hr class="hr">' +
      '<div class="kv"><span class="k">Receita de sites</span><span class="v">' + money(v.sites * v.preco) + '</span></div>' +
      '<div class="kv"><span class="k">MRR (' + comManut + " × " + money(cfg.manutMes) + ')</span><span class="v">' + money(mrr) + '</span></div>' +
      '<div class="kv"><span class="k">Receita total</span><span class="v">' + money(receita) + '</span></div>' +
      '<div class="kv"><span class="k">Custo fixo</span><span class="v" style="color:var(--red)">− ' + money(v.custo) + '</span></div>' +
      '<div class="kv"><span class="k"><b>Lucro esperado</b></span><span class="v" style="color:' + (lucro >= 0 ? "var(--green)" : "var(--red)") + ';font-size:17px">' + money(lucro) + '</span></div>' +
      '<p class="tiny" style="margin:8px 0 0">Precisa de <b>' + breakEven + ' site(s)</b> só para cobrir o custo. Com ' + comManut + ' manutenção(ões), seu ponto de equilíbrio cai para <b>' +
      (v.preco > 0 ? Math.max(0, Math.ceil((v.custo - mrr) / v.preco)) : 0) + '</b>. Meta sugerida: +3 manut/mês → ' + money(3 * cfg.manutMes * 12) + '/ano recorrente.</p>' +
      '</div>';
  }
  function slider(key, label, val, min, max, step, moneyFmt) {
    return '<label class="field"><span class="lbl row between">' + esc(label) + '<b class="mono">' + (moneyFmt ? Z.fmtBRL(val) : val) + '</b></span>' +
      '<input type="range" data-slider="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></label>';
  }
  function bindSliders() {
    document.querySelectorAll("[data-slider]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        App.lucro[inp.getAttribute("data-slider")] = Number(inp.value);
        var card = inp.closest(".card");
        var v = App.lucro;
        var s = st(), cfg = s.config;
        var comManut = s.clientes.filter(function (c) { return c.status === "ativo" && c.manutencao; }).length;
        var mrr = comManut * cfg.manutMes;
        var receita = v.sites * v.preco + mrr, lucro = receita - v.custo;
        inp.closest("label").querySelector("b").textContent = (inp.getAttribute("data-slider") === "sites") ? String(v.sites) : Z.fmtBRL(Number(inp.value));
        // os 5 números do card: sites, MRR, receita total, custo, lucro
        var nums = card.querySelectorAll(".kv .v");
        if (nums.length < 5) return;
        nums[0].textContent = Z.fmtBRL(v.sites * v.preco);
        nums[2].textContent = Z.fmtBRL(receita);
        nums[3].textContent = "− " + Z.fmtBRL(v.custo);
        nums[4].textContent = Z.fmtBRL(lucro);
        nums[4].style.color = lucro >= 0 ? "var(--green)" : "var(--red)";
        var meta = card.querySelector("p.tiny b");
        if (meta) meta.textContent = String(v.preco > 0 ? Math.ceil(v.custo / v.preco) : 0);
      });
    });
  }

  /* ====================================================================== */
  /*  PROSPECÇÃO                                                             */
  /* ====================================================================== */
  function viewProspect() {
    var S = window.ZeikStore, s = st(), f = App.filters, m2 = S.stats();
    var list = s.prospects.slice();
    if (f.q) {
      var q = f.q.toLowerCase();
      list = list.filter(function (p) {
        return [p.nome, p.contato, p.endereco, p.telefone, p.obs, p.bairro, p.cidade, p.insta, (seg(p.segmento) || {}).nome].join(" ").toLowerCase().indexOf(q) >= 0;
      });
    }
    if (f.bairro) list = list.filter(function (p) { return p.bairro === f.bairro; });
    if (f.segmento) list = list.filter(function (p) { return p.segmento === f.segmento; });
    if (f.status) list = list.filter(function (p) { return p.status === f.status; });
    if (f.prio) list = list.filter(function (p) { return p.prioridade === f.prio; });
    if (f.need === "site") list = list.filter(function (p) { return p.temSite === false; });
    if (f.need === "insta") list = list.filter(function (p) { return p.temInstagram === false; });
    if (f.need === "insta2") list = list.filter(function (p) { return p.temInstagram == null; });
    if (f.need === "nada") list = list.filter(function (p) { return p.temSite === false && p.temInstagram === false; });
    if (f.need === "telefone") list = list.filter(function (p) { return !p.telefone && !p.whats && !p.fixo; });
    if (f.zona) list = list.filter(function (p) { return (p.zona || "Sul") === f.zona; });
    if (f.raio === "dentro") list = list.filter(function (p) { return Z.ehRaio(p, s.config); });
    else if (f.raio === "fora") list = list.filter(function (p) { return !Z.ehRaio(p, s.config); });
    if (f.frescos) list = list.filter(function (p) { return !p.ultimoContato; });
    if (f.cidade) list = list.filter(function (p) { return String(p.cidade || "São Paulo") === f.cidade; });
    if (f.canal === "wa") list = list.filter(function (p) { return Z.canal(p) === "whatsapp" && p.whatsOk !== "nao"; });
    else if (f.canal === "ok") list = list.filter(function (p) { return p.whatsOk === "sim"; });
    else if (f.canal === "conferir") list = list.filter(function (p) { return Z.canal(p) === "whatsapp" && !p.whatsOk; });
    else if (f.canal === "ligar") list = list.filter(function (p) { return Z.canal(p) === "ligar"; });
    else if (f.canal === "sem") list = list.filter(function (p) { var c = Z.canal(p); return c === "maps" || c === "insta"; });
    if (f.ordem === "oportunidade") list.sort(function (a, b) { return (b.pontos || 0) - (a.pontos || 0); });
    var peso = function (p) { return (f.ordem === "oportunidade" && Z.canal(p) === "whatsapp" ? 22 : 0); };
    var pri = { alta: 3, media: 2, baixa: 1 };
    if (f.ordem === "score" || f.ordem === "oportunidade") list.sort(function (a, b) {
      var d = (S.score(b) + peso(b)) - (S.score(a) + peso(a));
      if (d) return d;
      d = (pri[b.prioridade] || 0) - (pri[a.prioridade] || 0);
      if (d) return d;
      var zz = ((a.zona || "") + a.bairro).localeCompare((b.zona || "") + b.bairro);
      return zz || a.nome.localeCompare(b.nome);
    });
    else if (f.ordem === "nome") list.sort(function (a, b) { return a.nome.localeCompare(b.nome); });
    else if (f.ordem === "recente") list.sort(function (a, b) { return (b.atualizadoEm || "") < (a.atualizadoEm || "") ? -1 : 1; });
    else if (f.ordem === "antigo") list.sort(function (a, b) { return (a.atualizadoEm || "") < (b.atualizadoEm || "") ? -1 : 1; });

    var bairros = s.config.bairros.concat(Object.keys(s.prospects.reduce(function (o, p) { if (p.bairro) o[p.bairro] = 1; return o; }, {})))
      .filter(function (v, i, a) { return a.indexOf(v) === i; });
    var opts = function (arr, cur, lbl) {
      return '<option value="">' + lbl + '</option>' + arr.map(function (x) {
        return '<option value="' + esc(x.id || x) + '"' + (cur === (x.id || x) ? " selected" : "") + '>' + esc(x.nome || x) + '</option>';
      }).join("");
    };

    var cidades = (function () {
      var m = {};
      s.prospects.forEach(function (p) { var c = p.cidade || "São Paulo"; m[c] = (m[c] || 0) + 1; });
      return Object.keys(m).sort(function (a, b) { return m[b] - m[a] || a.localeCompare(b); }).map(function (c) { return { id: c, nome: c + " (" + m[c] + ")" }; });
    })();
    var semTelefone = s.prospects.filter(function (p) { return !p.telefone && !p.whats && !p.fixo; }).length;
    var contatadosHoje = s.prospects.filter(function (p) { return p.ultimoContato && p.ultimoContato.slice(0, 10) === Z.todayISO(); }).length;

    var zonasCfg = (window.ZEIK_SEED && window.ZEIK_SEED.bairrosPorZona) || {};
    var zonas = (S.ZONAS || []);
    App._idsDaLista = list.map(function (p) { return p.id; });
    if (!App._fonesConf || App._fonesStamp !== s.prospects.length) {
      var fr = (Z.fonesRepetidos && Z.fonesRepetidos(s.prospects)) || { por: {} };
      App._fonesConf = fr.por; App._fonesStamp = s.prospects.length;
    }   // o botão "já chamei" age na lista filtrada
    return topbar("Prospecção — meu raio primeiro",
      list.length + " de " + s.prospects.length + " empresas · buscar com ⌘K / Ctrl+K",
      '<button class="btn sm quiet" data-act="atualizar-lista" title="Preenche telefone, site e Instagram que a pesquisa descobriu depois — sem mexer no que você já marcou">↻ Atualizar lista-base</button>' +
      '<button class="btn sm quiet" data-act="caca">🔎 Caçar mais empresas</button>' +

  /* ------------------------- drag & drop (ponteiro) -------------------- */
  var drag = null;
  function bindDragDrop() {
    var kan = document.getElementById("kanban");
    if (!kan) return;
    kan.addEventListener("pointerdown", onDown);
  }
  function onDown(ev) {
    var card = ev.target.closest(".kcard");
    if (!card) return;
    if (ev.target.closest("button")) return;              // não arrasta quando clica em ação
    var touch = ev.pointerType !== "mouse";
    var onHandle = !!ev.target.closest("[data-handle]");
    drag = {
      card: card, id: card.getAttribute("data-deal"), from: card.getAttribute("data-etapa"),
      x0: ev.clientX, y0: ev.clientY, started: false, touch: touch, armed: false,
      armedTimer: null, pointerId: ev.pointerId
    };
    if (touch && !onHandle) {
      drag.armedTimer = setTimeout(function () { if (drag) drag.armed = true; }, 240);
    } else if (touch) { drag.armed = true; card.style.touchAction = "none"; }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
    document.addEventListener("touchmove", blockScroll, { passive: false });
  }
  function blockScroll(ev) { if (drag && drag.started && drag.touch) { /* deixa rolar se não começou */ if (ev.cancelable) ev.preventDefault(); } }
  function onMove(ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (!drag.started) {
      if (Math.abs(dx) + Math.abs(dy) < 9) return;
      if (drag.touch && !drag.armed) { cancel(); return; }
      start(ev);
    }
    move(ev);
  }
  function start(ev) {
    drag.started = true;
    clearTimeout(drag.armedTimer);
    var ghost = drag.card.cloneNode(true);
    ghost.id = "dragGhost";
    ghost.className = "kcard";
    ghost.style.width = drag.card.offsetWidth + "px";
    ghost.querySelectorAll("button").forEach(function (b) { b.remove(); });
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.card.classList.add("dragging");
    document.body.style.userSelect = "none";
    move(ev);
  }
  function move(ev) {
    var g = drag.ghost;
    g.style.left = (ev.clientX - 24) + "px";
    g.style.top = (ev.clientY - 18) + "px";
    g.style.position = "fixed";
    drag.card.style.visibility = "hidden";
    var under = document.elementFromPoint(ev.clientX, ev.clientY);
    var col = under && under.closest ? under.closest(".kcol") : null;
    document.querySelectorAll(".kcol.drop").forEach(function (c) { if (c !== col) c.classList.remove("drop"); });
    drag.over = col ? col.getAttribute("data-col") : null;
    if (col) col.classList.add("drop");
  }
  function onUp() {
    if (!drag) return;
    if (drag.started) {
      var target = drag.over;
      var id = drag.id, from = drag.from;
      cancel();
      if (target && target !== from) App.moveDeal(id, target);
      else render();
    } else {
      var tocado = drag.id;
      cancel();
      App.modalDeal(tocado);          // toque simples no card abre o negócio
    }
  }
  function cancel() {
    if (!drag) return;
    clearTimeout(drag.armedTimer);
    if (drag.ghost) drag.ghost.remove();
    if (drag.card) { drag.card.classList.remove("dragging"); drag.card.style.visibility = ""; drag.card.style.touchAction = ""; }
    document.querySelectorAll(".kcol.drop").forEach(function (c) { c.classList.remove("drop"); });
    document.body.style.userSelect = "";
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", blockScroll);
    drag = null;
  }

  App.moveDeal = function (id, novaEtapa) {
    var S = window.ZeikStore, s = st();
    var d = s.deals.filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    if (!S.Etapas[novaEtapa]) { ui().toast("Etapa desconhecida — nada foi movido.", "warn", 4000); render(); return; }
    var anterior = d.etapa;
    if (anterior === novaEtapa) return;
    S.pushUndo("mover card");
    d.etapa = novaEtapa;
    d.ordem = Date.now() % 100000;
    d.atualizadoEm = new Date().toISOString();
    d.historico = (d.historico || []); d.historico.push({ etapa: novaEtapa, em: d.atualizadoEm });
    S.log("pipeline", d.empresa + ": " + ((S.Etapas[anterior] || {}).nome || anterior) + " → " + S.Etapas[novaEtapa].nome, d.id);
    S.saveNow();

    if (novaEtapa === "contatado") { App.modalFollowUp(d, anterior); return; }
    if (novaEtapa === "proposta") {
      App.modalProposta(d); return;
    }
    if (novaEtapa === "ganho") { App.modalGanho(d); return; }
    if (novaEtapa === "perdido") { App.modalPerdido(d); return; }
    render();
    ui().toast("Movido para " + S.Etapas[novaEtapa].nome, "ok");
  };

  function viewClientes() {
    var s = st(), f = App.filters;
    var list = s.clientes.slice();
    if (f.cq) {
      var q = f.cq.toLowerCase();
      list = list.filter(function (c) { return [c.empresa, c.contato, c.bairro, c.telefone, c.obs, c.segmento].join(" ").toLowerCase().indexOf(q) >= 0; });
    }
    if (f.cstatus) list = list.filter(function (c) { return c.status === f.cstatus; });
    list.sort(function (a, b) { return (b.valor || 0) - (a.valor || 0); });

      (prox.length ? '<p class="tiny" style="margin:12px 0 0">Na sequência: ' + prox.map(function (x) { return esc(x.nome); }).join(" · ") + "</p>" : "") +
      "</div>";
  }

  function relatorioMini(c) {
    var por = {};
    c.itens.forEach(function (it) { por[it.estado] = (por[it.estado] || 0) + 1; });
    var ordem = ["enviado", "respondeu", "reunião", "não", "sem numero", "na fila", "adiado"];
    var total = c.itens.length, enviados = (por.enviado || 0) + (por.respondeu || 0) + (por["reunião"] || 0) + (por["não"] || 0) + (por["sem numero"] || 0);
    var resp = (por.respondeu || 0) + (por["reunião"] || 0);
    var taxa = enviados ? Math.round(resp / enviados * 100) : 0;
    return '<div class="grid three">' + ordem.filter(function (k) { return por[k]; }).map(function (k) {
      var cor = (k === "respondeu" || k === "reunião") ? " var(--ok)" : (k === "sem numero" || k === "não") ? " var(--err)" : "";
      return '<div class="card kpi"><div class="label">' + esc(k) + '</div><div class="value"' + (cor ? ' style="color:' + cor + '"' : "") + '>' + por[k] + "</div>" +
        '<p class="tiny" style="margin:2px 0 0">' + Math.round(por[k] / total * 100) + "% da fila</p></div>";
    }).join("") + "</div>" +
      '<p class="tiny" style="margin:8px 0 0"><b>' + enviados + "</b> enviados · <b>" + resp + "</b> responderam · taxa de resposta <b>" + taxa + "%</b> · " +
      (total - enviados) + " na fila. " + (taxa < 12 ? "Taxa baixa: troque o gancho da 1ª mensagem (Configurações → Roteiros) antes de aumentar o volume." : "Taxa saudável — mantenha o ritmo e capriche no gatilho.") + "</p>";
  }

  function viewDisparo() {
    var S = window.ZeikStore, cfg = st().config;
    var c = S.campanha();
    var semWa = st().prospects.filter(function (p) { return !Z.numWhatsapp(p) && p.status === "novo"; }).length;
    var etapas = '<div class="grid three">' + ETAPAS.map(function (e, i) {
      var ativo = !c ? i === 0 : (i <= 2 ? true : false);
      return '<div class="card step' + (ativo && c ? " on" : "") + '"><div class="card-title" style="font-size:13px">' + esc(e[0]) + "</div>" +
        '<p class="tiny" style="margin:0">' + esc(e[1]) + "</p></div>";
    }).join("") + "</div>";
    var api = cfg.disparoApi || {};
    var painel = c ?
      '<div class="card"><div class="row" style="gap:10px;align-items:center">' +
      '<div style="flex:1;min-width:150px"><div class="card-title" style="margin-bottom:3px">' + esc(c.nome) + "</div>" +
      '<p class="tiny" style="margin:0">' + cadenciaTexto(c) + " · criada em " + esc(Z.fmtData(c.criadaEm.slice(0, 10))) + "</p></div>" +
      cronometroHTML(c) +
      "</div>" +
      '<div class="prog green" style="margin:10px 0 0"><i style="width:' + Math.round((c.itens.filter(function (x) { return x.estado !== "na fila"; }).length / Math.max(1, c.itens.length)) * 100) + '%"></i></div>' +
      '<div class="row wrap" style="margin-top:10px">' +
      '<button class="btn xs ghost" data-act="campanha-pausar">' + (c.proximoAte > Date.now() ? "▶ adiantar cadência" : "⏸ travar 8 min") + "</button>" +
      '<button class="btn xs ghost" data-act="campanha-relatorio">📄 Relatório</button>' +
      '<button class="btn xs ghost" data-act="campanha-csv">⬇ Exportar fila (CSV)</button>' +
      '<button class="btn xs ghost" data-act="campanha-resultado">⬆ Colar resultado do gateway</button>' +
      '<button class="btn xs ghost" data-act="campanha-nova">🎯 Nova fila</button>' +
      "</div></div>" + filaCard(c) +
      '<div class="card"><div class="card-title">📊 Relatório da fila</div>' + relatorioMini(c) + "</div>"
      :
      '<div class="card" style="border-color:var(--brand)"><div class="card-title">🎯 Monte a primeira fila</div>' +
      '<p class="tiny" style="margin:0 0 10px">O painel seleciona, ordena por score e segura o ritmo. Você só aperta o botão de cada lead — é assim que o número sobrevive ao WhatsApp e é assim que o print do curso vira rotina: <b>pouca mensagem boa, muitos contatos certos, 3 a 6 reuniões por dia</b>.</p>' +
      '<div class="row wrap"><button class="btn" data-act="campanha-nova">🎯 Montar fila de disparo</button>' +
      '<button class="btn ghost" data-act="coletor-abrir">🧰 Puxar dados novos (coletor)</button></div></div>';

    return topbar("Disparo em massa", "Fila assistida: o painel prepara a mensagem certa e cronometra o intervalo — quem aperta o botão é você",
      '<button class="btn sm ghost" data-act="coletor-abrir">🧰 Coletor</button>' +
      '<button class="btn sm" data-act="campanha-nova">🎯 Nova fila</button>') +
      '<div class="callout" style="margin-bottom:14px">🚫 <b>Disparo em massa não é abordagem.</b> Mandar a mesma mensagem pra 300 pessoas em 5 minutos derruba seu número e queima o lead. Aqui o volume é outro: <b>' +
      cfg.limiteDisparoDia + " leads/dia</b> no ritmo da cadência, cada um com a mensagem do segmento dele, e a meta é <b>reunião marcada</b>, não resposta.\"</div>" +
      etapas + painel +
      '<div class="grid two" style="margin-top:14px">' +
      '<div class="card"><div class="card-title">⚙️ Como o painel dispara</div>' +
      '<p class="tiny" style="margin:0 0 8px">Dois caminhos, o mesmo relatório:</p>' +
      '<ul class="tiny" style="margin:0 0 10px 16px;padding:0">' +
      "<li><b>Manual (padrão):</b> botão abre o WhatsApp Web/App com o texto pronto. Zero risco de bloqueio por automação, 100% controlado por você.</li>" +
      "<li><b>API (opcional):</b> você contrata um gateway (Evolution API, Z-API ou Meta Cloud API), cola a URL abaixo e o painel passa a enviar pela fila sozinho — respeitando a cadência.</li></ul>" +
      '<label class="row tiny" style="gap:6px;margin-bottom:8px"><input type="checkbox" data-autosave="config.disparoApi.ativo"' + (api.ativo ? " checked" : "") + "> usar conector de API</label>" +
      '<div class="field full"><span class="lbl">URL do endpoint de envio</span>' +
      '<input data-autosave="config.disparoApi.url" placeholder="https://sua-api.com/message/sendText/sua-instancia" value="' + esc(api.url || "") + '"></div>' +
      '<div class="field full"><span class="lbl">Chave da API (se o gateway pedir)</span>' +
      '<input data-autosave="config.disparoApi.chave" placeholder="apikey do gateway (se houver)" value="' + esc(api.chave || "") + '"></div>' +
      '<p class="tiny" style="margin:8px 0 0;color:var(--warn)">⚠️ API de WhatsApp não é gratuita nem silenciosa: a Meta cobra por conversa e número não-oficial pode ser banido. Deixe desligado até você ter lista limpa e texto aprovado.</p>' +
      "</div>" +
      '<div class="card"><div class="card-title">🧠 Roteiro em camadas (você modela)</div>' +
      '<p class="tiny" style="margin:0 0 6px">A 1ª mensagem é humana. A 2ª só sai quando ele cai na resposta automática. Tudo editável:</p>' +
      '<div class="row wrap" style="margin-bottom:8px">' +
      '<button class="btn xs ghost" data-act="modelar-abrir">✍️ Modelar roteiros</button>' +
      '<button class="btn xs quiet" data-act="voz-falar" data-tipo="m1">🔊 Ouvir a 1ª</button>' +
      "</div>" +
      '<div class="script-box" style="font-size:12.5px;margin-bottom:8px;max-height:none">' + esc(ui().fillVars((cfg.rota || {}).m1, ui().scriptCtx())) + "</div>" +
      '<div class="script-box" style="font-size:12.5px;max-height:none">' + esc(ui().fillVars((cfg.rota || {}).gatilho, ui().scriptCtx())) + "</div>" +
      '<p class="tiny" style="margin:8px 0 0">' + semWa + " leads da base ainda não têm celular — o coletor preenche isso. " +
      "<b>Nunca mande mensagem pra número que você não confirmou.</b></p></div></div>";
  }

  /* ------------------------- handlers do disparo ------------------------- */
  App.handlers["campanha-nova"] = function () { App.modalCampanha(); };
  App.handlers["p-whats-ok"] = function (el) {
    var p = window.ZeikStore.marcarWhats(el.getAttribute("data-id"), "sim");
    render();
    U.toast(p ? "🟢 " + p.nome + " confirmado com WhatsApp ativo — entra na fila na frente." : "Lead não encontrado.", "ok", 4000);
  };
  App.handlers["p-whats-nao"] = function (el) {
    var p = window.ZeikStore.marcarWhats(el.getAttribute("data-id"), "nao");
    render();
    U.toast(p ? "✖ " + p.nome + " saiu da fila de WhatsApp. Se ele tiver um celular novo, é só voltar aqui e marcar 🟢." : "Lead não encontrado.", "info", 5000);
  };
  App.handlers["filtro-frescos"] = function () {
    App.filters.frescos = App.filters.frescos ? "" : "1";
    render();
    U.toast(App.filters.frescos ? "Mostrando só quem nunca recebeu mensagem sua." : "Mostrando todos de novo.", "info", 2600);
  };
  App.handlers["marcar-chamados"] = function () {
    var ids = (App._idsDaLista || []).slice();
    if (!ids.length) { U.toast("Nenhum lead na lista — ajuste os filtros antes.", "warn"); return; }
    var r = Z.marcarComoChamados(ids);
    render();
    U.toast("✔ " + r.marcados + " marcados como já chamados" + (r.ja ? " (" + r.ja + " já estavam)" : "") + " — saíram da fila. Os cadastros continuam aqui.", "ok", 6000);
  };
  App.handlers["campanha-pausar"] = function () {
    var S = window.ZeikStore, c = S.campanha(); if (!c) return;
    if (c.proximoAte > Date.now()) { c.proximoAte = 0; ui().toast("Cadência liberada no susto — evite isso, o número percebe.", "err", 6000); }
    else c.proximoAte = Date.now() + 8 * 60000;
    S.saveNow(); App.render();
  };
  App.handlers["campanha-relatorio"] = function () { App.modalRelatorio(); };
  App.handlers["campanha-csv"] = function () {
    var c = window.ZeikStore.campanha(); if (!c) return;
    var linhas = ["nome;telefone;cidade;bairro;estado;tentativas;obs"];
    c.itens.forEach(function (it) {
      var p = st().prospects.filter(function (x) { return x.id === it.prospectId; })[0] || {};
      linhas.push([p.nome || it.nome, it.telefone || "", p.cidade || "São Paulo", p.bairro || "", it.estado, it.tentativas || 0, (it.obs || p.obs || "").replace(/;/g, ",")].join(";"));
    });
    ui().download("zeik-fila-" + Z.todayISO() + ".csv", "" + linhas.join("\n"), "text/csv;charset=utf-8");
    ui().toast("CSV da fila baixado — dá pra abrir no Google Sheets e filtrar por cidade.", "ok", 6000);
  };
  App.handlers["campanha-resultado"] = function () { App.modalResultado(); };
  App.handlers["fila-whatsapp"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var it = c && c.itens[i]; if (!it) return;
    var p = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
    if (!p) { ui().toast("Lead não está mais na base.", "err"); return; }
    var ctx = ui().scriptCtx({ p: p, empresa: p.nome, contato: p.contato || "chefe" });
    var texto = ui().fillVars((st().config.rota || {}).m1 || "Oi {{contato}}, tudo bem? Mandei um modelo de site da {{empresa}} pra você dar uma olhada.", ctx);
    var fone = Z.numWhatsapp(p);
    if (fone) ui().openWa(fone, texto);
    else {
      var alt = Z.canal(p);
      if (alt === "ligar") ui().openTel(p.fixo || p.telefone);
      else if (alt === "insta") ui().google((p.insta || p.nome) + " instagram");
      else ui().copy(texto, "Sem número — mensagem copiada. Cole depois de pegar o celular no balcão.");
      ui().toast("Este lead não tem celular na base. Marque “sem WhatsApp” pra limpar a fila.", "err", 6000);
      return;
    }
    S.marcarItem(c.id, i, "enviado");
    App.agendarProximo(S.campanha(c.id));
    S.log("disparo", "1ª mensagem enviada para " + p.nome, p.id);
    ui().toast("💬 Enviado · cadência ligada", "ok", 4000);
    App.render();
  };
  App.handlers["fila-copiar"] = function (b) {
    var c = window.ZeikStore.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var it = c && c.itens[i]; var p = st().prospects.filter(function (x) { return x.id === it.prospectId; })[0] || {};
    var ctx = ui().scriptCtx({ p: p, empresa: p.nome, contato: p.contato || "chefe" });
    var rota = st().config.rota || {}; var tpl = rota[b.getAttribute("data-tipo")] || rota.m1;
    ui().copy(ui().fillVars(tpl, ctx), (b.getAttribute("data-tipo") === "gatilho" ? "⚡ Gatilho" : "1ª mensagem") + " copiada");
  };
  App.handlers["fila-marcar"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var estado = b.getAttribute("data-estado");
    var it = c && c.itens[i]; if (!it) return;
    var p0 = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
    S.marcarItem(c.id, i, estado);
    if (estado === "enviado") App.agendarProximo(S.campanha(c.id));
    /* Ele respondeu? Se for a mensagem automática do balcão, a próxima é o gatilho. */
    if (estado === "respondeu" && p0) {
      var ctxR = ui().scriptCtx({ p: p0, empresa: p0.nome, contato: p0.contato || "chefe" });
      var gatilhoTxt = ui().fillVars((st().config.rota || {}).gatilho || "", ctxR);
      if (gatilhoTxt) ui().copy(gatilhoTxt, "⚡ Respondeu: o gatilho (2ª mensagem) já está copiado. Se foi mensagem automática do balcão, mande agora; se foi dúvida de verdade, responda na hora e depois mande o link.");
      if ((st().config.voz || {}).auto) ui().falar(gatilhoTxt, { forcar: false });
      App.agendarProximo(S.campanha(c.id));
    }
    if (estado === "reunião") {
      var el = { getAttribute: function (k) { return k === "data-id" ? it.prospectId : null; } };
      App.handlers["p-converter"](el);
      ui().toast("📅 Reunião marcada: virou negociação no Kanban com a prévia pra montar.", "ok", 6000);
      return;
    }
    if (estado === "sem numero") {
      var p2 = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
      if (p2) App.modalPegarWhats(p2);
      return;
    }
    S.log("disparo", it.nome + " → " + estado, it.prospectId);
    App.render();
  };
  App.handlers["fila-pular"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    if (!c || !c.itens[i]) return;
    var it = c.itens.splice(i, 1)[0];
    it.estado = "adiado"; c.itens.push(it);
    S.saveNow(); App.render(); ui().toast("Jogei pro fim da fila.", "ok", 2500);
  };
  /* A "prévia" é a arma da abordagem: o modelo já montado, baixável e mandável. */
  App.handlers["fila-abrir-site"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var it = c && c.itens[i]; if (!it) return;
    var p = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
    if (!p) return;
    if (!window.ZeikSite || !window.ZeikSite.gerar) { ui().toast("Gerador indisponível neste aparelho.", "err"); return; }
    var html = window.ZeikSite.gerar({
      empresa: p.nome, bairro: p.bairro || p.cidade || "", endereco: p.endereco || "", telefone: Z.foneParaUso(p),
      telefoneFmt: Z.fmtTel(Z.foneParaUso(p)), whatsapp: Z.toWa(Z.numWhatsapp(p) || p.whats || p.telefone),
      segmento: p.segmento, sobre: (seg(p.segmento) || {}).sobre || ""
    });
    var nome = String(p.nome).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 34) + "-modelo.html";
    window.ZeikSite.baixar(nome, html);
    S.log("site", "Baixou o modelo de " + p.nome + " (prévia da abordagem)", p.id);
    ui().toast("🧪 Modelo de " + p.nome + " baixado. Abra no celular e mande como print ou arquivo — é isso que abre a conversa.", "ok", 8000);
    App.render();
  };
  App.handlers["voz-falar"] = function (b) {
    var cfg = st().config;
    var tipo = b.getAttribute("data-tipo") || "m1";
    var texto;
    if (b.getAttribute("data-cam")) {
      var c = window.ZeikStore.campanha(b.getAttribute("data-cam"));
      var it = c && c.itens[Number(b.getAttribute("data-i"))];
      var p = st().prospects.filter(function (x) { return x.id === (it && it.prospectId); })[0] || {};
      texto = ui().fillVars(cfg.rota[tipo] || cfg.rota.m1, ui().scriptCtx({ p: p, empresa: p.nome, contato: p.contato || "chefe" }));
    } else texto = ui().fillVars(cfg.rota.m1, ui().scriptCtx());
    if (!ui().falar(texto, { botao: b })) ui().toast("Voz indisponível neste navegador.", "err");
  };
  App.handlers["coletor-abrir"] = function () { App.modalColetor(); };
  App.handlers["ensinar"] = function () { App.modalEnsinar(); };
  App.handlers["jump-disparo"] = function () { ui().go("disparo"); };
  App.handlers["cobrar-abrir"] = function (b) { App.modalCobranca(b.getAttribute("data-pid") || null); };

  App.STATUS_LABEL = STATUS_LABEL;
  App.getPath = getPath;
  App.get = function () { return st(); };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { });
})();

</script>
<script>
/* ==========================================================================
   ZEIK DIGITAL — Ações, formulários e modais
   Arquivo: assets/js/modals.js  (usa App.handlers definidos em ui.js/app.js)
   ========================================================================== */
(function () {
  "use strict";

  var App = window.App, U = window.ZeikUI, S = null;
  function st() { return window.ZeikStore.state; }
  function render() { U.render(); }
  function esc(s) { return Z.esc(s); }
  function money(v) { return Z.fmtBRL(v); }
  function seg(id) { return U.segById(id); }
  function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
  function findProspect(id) { return byId(st().prospects, id); }
  function findDeal(id) { return byId(st().deals, id); }
  function findCliente(id) { return byId(st().clientes, id); }
  function findTarefa(id) { return byId(st().tarefas, id); }
  function findPag(id) { return byId(st().financeiro, id); }

  function readForm(root) {
    var o = {};
    root.querySelectorAll("[data-f]").forEach(function (el) {
      var k = el.getAttribute("data-f");
      if (el.type === "radio") { if (el.checked) o[k] = el.value; return; }   // grupo: só o marcado vale
      if (el.type === "checkbox") { o[k] = !!el.checked; return; }
      if (el.type === "number") { o[k] = el.value === "" ? "" : Number(el.value); return; }
      o[k] = (el.value || "").trim();
    });
    return o;
  }
  function fld(label, html) { return '<label class="field"><span class="lbl">' + esc(label) + '</span>' + html + '</label>'; }
  function inp(name, val, type, ph, extra) {
    return '<input type="' + (type || "text") + '" data-f="' + name + '" value="' + esc(val == null ? "" : val) + '" placeholder="' + esc(ph || "") + '" ' + (extra || "") + '>';
  }
  function sel(name, opts, cur) {
    return '<select data-f="' + name + '">' + opts.map(function (o) {
      return '<option value="' + esc(o.id != null ? o.id : o) + '"' + (String(cur) === String(o.id != null ? o.id : o) ? " selected" : "") + '>' + esc(o.nome != null ? o.nome : o) + '</option>';
    }).join("") + '</select>';
  }
  function txta(name, val, ph) { return '<textarea data-f="' + name + '" placeholder="' + esc(ph || "") + '">' + esc(val || "") + '</textarea>'; }

  /* ====================================================================== */
  /*  PROSPECÇÃO — CRUD                                                      */
  /* ====================================================================== */
  function whs_ok(i) { return i.tipo === "celular" || !i.dig; }
  var ZONAS = window.ZeikStore.ZONAS;   // as 5 zonas da cidade, definidas no store
  var SITE_OPTS = [{ id: "", nome: "— não sei / não tem" }, { id: "gratuito", nome: "🔴 site grátis (Wix/Canva/lojinha)" },
    { id: "google-sites", nome: "🔴 Google Sites (amador)" }, { id: "negocio_site", nome: "🔴 página grátis do Google (negocio.site)" },
    { id: "linktree", nome: "🟠 só Linktree / agregador" }, { id: "booksy", nome: "🟠 agenda no Booksy/inDrive-like" },
    { id: "instagram", nome: "🟠 só Instagram" }, { id: "proprio", nome: "🟢 site próprio decente" }];

  function prospectForm(p) {
    var cfg = st().config, bairros = cfg.bairros;
    var sgm = window.ZEIK_SEED.segmentos.map(function (g) { return { id: g.id, nome: g.emoji + " " + g.nome }; });
    return U.modalShell(
      p ? "Editar prospect" : "Novo prospect",
      p ? '<span class="badge gray">' + esc(p.origem || "manual") + '</span>' : "Cadastre agora o que você viu na rua — leva 20 segundos",
      '<div class="form-grid">' +
      '<label class="field full"><span class="lbl">Nome da empresa *</span>' + inp("nome", p && p.nome, "text", "Ex.: Barbearia do Zé") + '</label>' +
      fld("Pessoa do contato", inp("contato", p && p.contato, "text", "Dono / gerente — nome aumenta a conversão")) +

  App.modalProspect = function (id) {
    var p = id ? findProspect(id) : null;
    var ov = U.openModal(prospectForm(p), { wide: true });
    // bairro → zona automática (ele só digita o bairro)
    var bEl = ov.querySelector('[data-f="bairro"]'), zEl = ov.querySelector('[data-f="zona"]');
    function syncZona() {
      if (!bEl || !zEl) return;
      var z = Z.zonaPorBairro(bEl.value);
      if (!z) return;
      for (var i = 0; i < zEl.options.length; i++) if (zEl.options[i].value === z) { zEl.value = z; break; }
    }
    if (bEl) { bEl.addEventListener("input", syncZona); bEl.addEventListener("change", syncZona); if (!p) syncZona(); }
    ov.querySelector("[data-save]").addEventListener("click", function () {
      var v = readForm(ov);
      if (!v.nome) { U.toast("Dê um nome pra empresa.", "err"); return; }
      var infoW = Z.foneInfo(v.whats), infoF = Z.foneInfo(v.fixo);
      var whats = infoW.tipo === "celular" ? infoW.display : (infoW.tipo === "invalido" ? v.whats : "");
      var fixo = infoF.display || "";
      // celular digitado no campo do fixo: vira WhatsApp automaticamente
      if (!whats && infoF.tipo === "celular") { whats = infoF.display; fixo = ""; }
      if (infoW.tipo === "fixo") {
        U.toast("⚠️ “" + infoW.display + "” tem 8 dígitos depois do DDD → é telefone FIXO, não abre WhatsApp. Guardamos em “Telefone fixo” e deixamos o WhatsApp vazio.", "warn", 9000);
      }
      var data = {
        nome: v.nome, contato: v.contato, segmento: v.segmento, bairro: v.bairro,
        zona: v.zona || Z.zonaPorBairro(v.bairro),
        whats: whats, telefone: whats, fixo: fixo, siteAtual: v.siteAtual || "",
        busca: whats ? "" : (v.nome + " " + v.bairro + " São Paulo"),
        endereco: v.endereco, prioridade: v.prioridade, status: v.status,
        temSite: v.temSite === "nao" ? false : v.temSite === "sim" ? true : null,
        temInstagram: v.temInstagram === "nao" ? false : v.temInstagram === "sim" ? true : null,
        insta: v.insta, obs: v.obs,
        ticket: Number(v.ticket) || 0,
        atualizadoEm: new Date().toISOString()
      };
      S.pushUndo(p ? "editar prospect" : "novo prospect");
      if (p) Object.assign(p, data);
      else { data.id = Z.uid("p"); data.criadoEm = data.atualizadoEm; data.ultimoContato = null; data.convertidoId = null; data.origem = "Manual"; st().prospects.unshift(data); }
      S.log("prospect", (p ? "Atualizou " : "Adicionou prospect ") + v.nome, data.id || p && p.id);

    });

  function precosProposta(deal, cliente) {
    var cfg = st().config;
    var itens = (deal && deal.itens) || (cliente && cliente.itens) || { site: true, insta: true, gmn: false, manut: false };
    var linhas = [];
    var total = 0;
    if (itens.site) { var pv = Number(deal && deal.valor) || cfg.precoSite; linhas.push({ nome: "Site profissional (landing + páginas de serviços)", valor: pv }); total += pv; }
    if (itens.insta) { linhas.push({ nome: "Criação do Instagram OU organização de feed + destaques", valor: cfg.precoInsta }); total += cfg.precoInsta; }
    if (itens.gmn) { linhas.push({ nome: "Google Meu Negócio configurado (endereço, fotos, avaliações)", valor: cfg.precoGmn }); total += cfg.precoGmn; }
    if (itens.manut) { linhas.push({ nome: "Manutenção mensal (alterações, backup, suporte)", valor: cfg.manutMes, mensal: true }); }
    if (!linhas.length) { total = cfg.precoSite; linhas.push({ nome: "Site profissional", valor: cfg.precoSite }); }
    return { linhas: linhas, total: total, itens: itens };
  }

  function gerarTextoProposta(nomeEmpresa, d, ctx) {
    var cfg = st().config;
    var P = precosProposta(d);
    var hoje = new Date();
    var validade = new Date(hoje.getTime() + 5 * 86400000);
    var l = [];
    l.push("*" + (d && d.tituloProposta || "PROPOSTA — " + nomeEmpresa.toUpperCase()) + "*");
    l.push(cfg.agencia + " · " + cfg.cidade);
    l.push(hoje.toLocaleDateString("pt-BR") + " · válida até " + validade.toLocaleDateString("pt-BR"));
    l.push("");
    if (d.contato) l.push(d.contato + ", tudo bem?");
    l.push("Conforme conversamos, " + nomeEmpresa + " foi analisado por aqui: pesquisa de mercado no bairro + concorrência online. O diagnóstico abaixo é o que eu faria.");
    l.push("");
    l.push("*1. O QUE EU VI*");
    l.push(ctx.diagnostico);
    l.push("");
    l.push("*2. O QUE EU ENTREGO*");
    P.linhas.forEach(function (x, i) {
      l.push((i + 1) + ") " + x.nome + " — " + money(x.valor) + (x.mensal ? "/mês" : ""));
      l.push("   " + (DETALHE[x.nome] || "Feito à mão, no seu estilo, com textos revisados."));
    });
    l.push("");
    l.push("*3. PRAZO*");
    l.push("Começo após o OK e o envio do material (fotos, textos, logo). Entrega em " + cfg.prazoEntrega + ".");
    l.push("");
    l.push("*4. INVESTIMENTO*");
    l.push("Total: *" + money(P.total) + "*");
    l.push("Forma: PIX à vista (5% de desconto até " + validade.toLocaleDateString("pt-BR") + ") ou 3x no cartão.");
    if (P.itens.manut) l.push("Manutenção: " + money(cfg.manutMes) + "/mês, sem fidelidade — cancelar quando quiser.");
    l.push("");
    l.push("*5. GARANTIA*");
    l.push("Se você não gostar da primeira versão, eu refaço. Se ainda assim não servir, devolvo o valor pago.");
    l.push("");
    l.push("Qualquer dúvida, é só me chamar aqui. Se estiver de acordo, responda \"fechado\" que eu já começo hoje. 🚀");
    l.push("");
    l.push("Att,");
    l.push((cfg.responsavel || "Zeik Digital") + " — " + cfg.agencia);
    l.push(cfg.whatsappDisplay + " · " + cfg.email);
    return l.join("\n").replace(/\n{3,}/g, "\n\n");
  }

  App.exportBackup = function () {
    var nome = "zeik-backup-" + Z.todayISO() + ".json";
    U.download(nome, S.exportJSON(), "application/json");
    st().config.ultimoBackupExport = new Date().toISOString();
    S.snapshot("antes do download");
    S.saveNow();
  };
  App.exportCSV = function () {
    var s = st(), lines = [];
    var head = "empresa;contato;segmento;zona;bairro;endereco;whatsapp_celular;telefone_fixo;status;prioridade;tem_site;site_atual;tem_instagram;obs\n";
    lines.push(head);
    s.prospects.forEach(function (p) {
      lines.push([p.nome, p.contato, seg(p.segmento).nome, p.zona || "", p.bairro, p.endereco,
      p.whats || p.telefone || "", p.fixo || "", (App.STATUS_LABEL[p.status] || [""])[0], p.prioridade,
      p.temSite === false ? "não" : p.temSite ? "sim" : "?", (Z.SITE_ATUAL || {})[p.siteAtual] || (p.temSite ? "próprio" : ""),
      p.temInstagram === false ? "não" : p.temInstagram ? "sim" : "?", (p.obs || "")]
        .map(csvCell).join(";"));
    });
    var csvCli = "\n# CLIENTES\nempresa;contato;segmento;bairro;telefone;valor;status;manutencao;entregue\n";
    s.clientes.forEach(function (c) {
      csvCli += [c.empresa, c.contato, seg(c.segmento).nome, c.bairro, c.telefone, c.valor, c.status, c.manutencao ? "sim" : "não", c.entregue || ""]
        .map(csvCell).join(";") + "\n";
    });
    var csvFin = "\n# FINANCEIRO\ndata;descricao;tipo;valor;status\n";
    s.financeiro.forEach(function (f) { csvFin += [f.data, f.descricao || "", f.tipo, f.valor, f.status].map(csvCell).join(";") + "\n"; });
    U.download("zeik-zona-sul-" + Z.todayISO() + ".csv", "\ufeff" + lines.join("\n") + csvCli + csvFin, "text/csv");
  };
  App.modalImport = function () {
    var ov = U.openModal(U.modalShell("⬆ Restaurar backup",
      "Aceita o .json exportado por este painel. O estado atual vira snapshot antes de sobrescrever.",
      '<div class="col">' +
      '<label class="field"><span class="lbl">Arquivo .json</span><input type="file" id="impFile" accept=".json,application/json"></label>' +
      '<span class="tiny">ou cole o conteúdo abaixo</span>' +
      '<textarea data-f="json" placeholder=\'{"app":"Zeik Digital…"}\' style="min-height:120px"></textarea>' +
      '</div>',
      '<button class="btn quiet" data-close>Cancelar</button><button class="btn" data-save>Restaurar</button>'));
    var file = ov.querySelector("#impFile");
    file.addEventListener("change", function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { ov.querySelector("[data-f=json]").value = fr.result; U.toast("Arquivo lido: " + f.name, "ok"); };
      fr.onerror = function () { U.toast("Não consegui ler esse arquivo.", "err"); };
      fr.readAsText(f);
    });
    ov.querySelector("[data-save]").addEventListener("click", function () {
      var txt = ov.querySelector("[data-f=json]").value.trim();
      if (!txt) { U.toast("Escolha o arquivo ou cole o JSON.", "err"); return; }
      var r = S.importJSON(txt);
      if (!r.ok) { U.toast(r.msg, "err", 6000); return; }
      U.closeModal(ov); render(); U.toast(r.msg, "ok");
    });
  };

      var lista = st().prospects.filter(function (p) {
        if (f.somenteWhats && !Z.numWhatsapp(p)) return false;

      ["Só você vê a base", "Em <b>Configurações → Proteção do painel</b>: ative um PIN de 4–8 dígitos e ligue <b>Travar a tela após X min</b> (5 min é bom). Os dados ficam no <i>localStorage</i> do aparelho: não sobem pra servidor nenhum, não tem login de terceiros.", []],
      ["Levar a base pro iPad (e de volta)", "<b>Configurações → base privada → Exportar base privada (.json)</b>. Salve no seu Drive/iCloud. No outro aparelho: <b>Carregar do arquivo</b>. Não mande esse arquivo por WhatsApp pra ninguém.", []]]],
    ["1 · Público: escolher a cidade pequena certa", [
      ["O alvo", "Negócio de bairro em cidade de 8 a 60 mil habitantes: barbearia, salão, estética, pet shop, ótica, auto, material de construção, pizzaria. Eles têm qualidade e não têm página.", []],
      ["Onde achar (grátis, 4 min por cidade)", "<a href='https://www.fresha.com/lp/pt/bt/barbearias/br-são-paulo' target='_blank' rel='noopener'>Fresha (salões e barbearias)</a> mostra telefone no bloco “Ligar para fazer reserva”. <a href='https://www.google.com/maps' target='_blank' rel='noopener'>Google Maps</a> mostra endereço e telefone em qualquer nicho. Copie nome, endereço e telefone.", []],
      ["Trazer pro painel", "<b>🧰 Coletor</b> (no topo da Prospecção ou do Disparo) → cole uma empresa por linha → olhe a prévia → <b>Importar pra base</b>. Ele separa celular de fixo sozinho e não duplica quem já existe.", []],
      ["Checar se ele já tem site", "Busque “<span class='mono'>nome da empresa + cidade</span>” no Google. Sem site = venda fácil. Só Linktree/Instagram = venda média. Site bonito = próximo lead.", []]]],
    ["2 · Modelo: escrever o seu roteiro (não o meu)", [
      ["Abrir o editor", "<b>Disparo → ✍️ Modelar roteiros</b> (ou Scripts → Modelar meus roteiros). Cinco caixas: 1ª mensagem, gatilho, reunião, no-show, follow-up.", []],
      ["Usar as variáveis", "Aperte nos chips (<span class='mono'>{{empresa}}</span>, <span class='mono'>{{contato}}</span>, <span class='mono'>{{bairro}}</span>, <span class='mono'>{{valorZeik}}</span>, <span class='mono'>{{doisHorarios}}</span>…). O painel troca pelo dado de cada lead na hora de mandar.", []],
      ["A regra do preço", "Em <b>Política de preço</b> deixe <b>“só quando ele perguntar”</b>. A abertura fala do negócio dele (quantos clientes novos pagam o site), não da sua tabela. A faixa entra no fechamento e na proposta.", []],
      ["Ouvir antes de mandar", "<b>🔊 Ouvir</b> em cada caixa (e em todo card da fila). Em <b>Configurações → 🔊 O painel fala com você</b>, escolha a voz e a velocidade. No iPhone: baixe a voz <b>Português (Brasil)</b> em Ajustes → Acessibilidade → Conteúdo Falado.", []]]],
    ["3 · Disparo: volume com cadência (é aqui que a maioria quebra o número)", [
      ["Montar a fila", "<b>Disparo → 🎯 Nova fila</b>. Escolha região/cidade/segmento, o tamanho da fila e a cadência. O painel ordena por score (quem tem celular, sem site, prioridade alta vem primeiro).", []],
      ["O ritmo", "4 a 8 minutos entre mensagens, pausa de 10 a 20 a cada 10 leads, no máximo <b>40 leads/dia</b> (ajusta em Configurações). O cronômetro aparece no topo da tela — enquanto ele conta, <b>não mande</b>.", []],
      ["Mandar de verdade", "Botão <b>💬 Abrir WhatsApp com a 1ª</b>: abre a conversa do lead com o texto pronto (você dá a última olhada e aperta enviar). O painel marca “enviado” e liga o cronômetro.", []],
      ["Se você quiser API mesmo", "Isso é contratar um gateway: <a href='https://doc.evolution-api.com' target='_blank' rel='noopener'>Evolution API</a> (self-hosted), <a href='https://z-api.com.br' target='_blank' rel='noopener'>Z-API</a> (paga, BR) ou <a href='https://developers.facebook.com/docs/whatsapp/cloud-api' target='_blank' rel='noopener'>Meta Cloud API</a> (oficial, cobra por conversa, precisa de aprovação de mensagem). Você cola a URL em <b>Disparo → Conector de API</b> e o painel passa a usar sua fila. <b>Enquanto estiver desligado, nada é enviado sozinho</b> — é o modo seguro.", []]]],
    ["4 · Resposta: a 2ª mensagem é gatilho, não é insistência", [
      ["Caiu na automática", "Ele respondeu “estou em atendimento, me diga o que precisa”? Isso é a mensagem automática do balcão. Marque <b>💬 Respondeu</b> no card: o painel copia o <b>gatilho</b> e te mostra. Manda na hora — é mais curto, mais direto e com o link da prévia.", []],
      ["Respondeu de verdade", "Perguntou preço? Fale da faixa e do que está incluso (1ª página, Google, botão de WhatsApp, prazo). Pediu pra pensar? Manda o <b>modelo pronto</b> (botão 🧪 Prévia do site baixa o HTML — abra no celular e mande print ou arquivo).", []],
      ["Sem WhatsApp", "<b>✖ Sem WhatsApp</b> no card: o painel limpa o lead e te manda caçar o celular. Número fixo nunca recebe mensagem de venda.", []]]],
    ["5 · Reunião: é isso que conta no dia", [
      ["Fechamento de agenda", "Botão <b>📅 Reunião</b>: o lead vira negociação no Kanban com os dados já preenchidos. O roteiro usa <span class='mono'>{{doisHorarios}}</span> — “amanhã 10h ou quinta 15h?” fecha 3x mais que “quando puder”. ", []],
      ["Meta real", "3 a 6 reuniões por dia, não 200 mensagens. Se a fila anda e ninguém marca reunião, o problema é o gancho da 1ª mensagem (volte ao passo 2) — não o volume.", []],
      ["Ele sumiu", "<b>📄 Relatório → Criar follow-up de quem não respondeu</b> cria tarefa pra amanhã, uma mensagem só. Depois disso, a pessoa sai da sua frente e entra na lista do mês que vem.", []]]],
    ["Pós · Relatório, cobrança e limpeza", [
      ["Ler o que aconteceu", "<b>Disparo → 📄 Relatório</b>: taxa de resposta por cidade e por segmento, melhor horário de envio e quantos números eram inválidos. Baixe o CSV quando quiser comparar semanas.", []],
      ["Colar o resultado da API", "Se você disparou por gateway, use <b>⬆ Colar resultado do gateway</b> (linhas <span class='mono'>número;status</span>). O painel marca enviado/falha na base — sem backend no meio.", []],
      ["Cobrar sem depender de ninguém", "<b>💸 Gerar cobrança</b>: monta o <b>PIX copia-e-cola</b> (BR Code, com CRC calculado no seu navegador) e o QR. Ou use o <b>link do Mercado Pago</b>: no app MP → <i>Receber dinheiro → Criar link de pagamento</i> → cole o <span class='mono'>mpago.la/…</span> em Configurações. Cartão, boleto e PIX caem na sua conta; o painel lança como “a receber”.", []],
      ["Fechar no Google", "Depois do sim: <a href='https://business.google.com' target='_blank' rel='noopener'>Google Meu Negócio</a> do cliente apontando pro site publicado. É o que faz o site trabalhar — e o que justifica a manutenção mensal.", []]]],
    ["Se der ruim (os 4 erros que matam a operação)", [
      ["Número bloqueado", "Pare de mandar por 48h. Reduza para 20/dia, troque a 1ª mensagem (nada de “olá, tudo bem? trabalho com sites”) e não mande link na primeira mensagem de um número novo.", []],
      ["Perdeu os leads", "Backup semanal: <b>Configurações → ⬇ Baixar backup .json</b>. Limpar dados do navegador ou desinstalar o app apaga o que está salvo nele.", []],
      ["Mensagem copiada e igual pra todo mundo", "O lojista reconhece em 1 segundo. Use o card do lead: o painel já troca nome, bairro e o ângulo; você muda a primeira linha.", []],
      ["Falar de preço antes de mostrar o modelo", "Perde venda e queima a confiança. Mostre a prévia primeiro; preço na reunião e na proposta.", []]]]
  ];
  App.modalEnsinar = function () {
    var corpo = ENSINO.map(function (sec, i) {
      return '<div class="card-flat" style="padding:12px 14px;margin-bottom:10px"><div class="card-title" style="font-size:13.5px">' + esc(sec[0]) + "</div>" +
        sec[1].map(function (p) {
          var ligs = (p[2] || []).map(function (l) {
            return '<button class="btn xs ghost" data-act="jump" data-view="' + l[1].replace("#/", "") + '">' + esc(l[0]) + "</button>";
          }).join(" ");
          return '<div style="padding:7px 0;border-top:1px solid var(--hairline)">' +
            '<div class="row wrap" style="gap:8px;align-items:baseline"><b class="tiny">' + esc(p[0]) + "</b>" + (ligs ? '<span class="row wrap" style="gap:5px;margin-left:auto">' + ligs + "</span>" : "") + "</div>" +
            '<p class="tiny" style="margin:3px 0 0">' + p[1] + "</p></div>";
        }).join("") + "</div>";
    }).join("");
    U.openModal(U.modalShell("🎓 Como usar o painel (o curso em 8 passos)",
      "Do print do WhatsApp ao PIX na conta. Cada linha é um clique — nada aqui depende de programador, servidor ou mensalidade.",
      '<div class="callout" style="margin-bottom:12px">🧠 <b>A tese do Whats Ouro, no seu painel:</b> disparo em massa <b>não</b> é abordagem. Venda é volume <i>filtrado</i>: poucos leads certos, mensagem boa, cadência que não queima o número e reunião como única métrica que importa. O resto é ruído.</div>' +
      corpo + '<p class="tiny">Fontes públicas usadas na coleta (Fresha, Google Maps, diretórios): confirme nome, número e endereço na primeira mensagem — dado velho é o principal motivo de “não é meu número”.</p>',
      '<button class="btn quiet" data-close>Fechar</button>' +
      '<button class="btn ghost" data-act="ensinar-copiar">⧉ Copiar o passo a passo</button>' +
      '<button class="btn" data-act="ensinar-baixar">⬇ Salvar .md no aparelho</button>'), { wide: true });
  };
  function textoEnsino() {
    return "# ZEIK DIGITAL — como usar o painel (passo a passo)\n\n" + ENSINO.map(function (sec) {
      return "\n## " + sec[0] + "\n" + sec[1].map(function (p) { return "- **" + p[0] + "** — " + String(p[1]).replace(/<[^>]+>/g, "").replace(/\n/g, " "); }).join("\n");
    }).join("\n") + "\n\n> Meta: 150 empresas mapeadas por região · 3 a 6 reuniões por dia · 40 mensagens/dia no máximo, com cadência.\n";
  }
  App.handlers["ensinar-copiar"] = function () { U.copy(textoEnsino(), "Passo a passo copiado (o HTML interno virou texto limpo)."); };
  App.handlers["ensinar-baixar"] = function () { U.download("zeik-como-usar.md", textoEnsino(), "text/markdown;charset=utf-8"); U.toast("Arquivo salvo — dá pra abrir no celular e editar.", "ok"); };

  U.__celebrate = function () {
    var n = 26, html = "";
    for (var i = 0; i < n; i++) {
      var x = Math.random() * 100, delay = (Math.random() * 0.5).toFixed(2), c = ["#0071e3", "#34c759", "#ff9500", "#5856d6", "#af52de"][i % 5];
      html += '<span style="position:fixed;left:' + x + 'vw;top:-10px;width:7px;height:12px;background:' + c + ';border-radius:2px;z-index:400;pointer-events:none;animation:fall 2.6s ' + delay + 's linear forwards"></span>';
    }
    var stl = document.createElement("style");
    stl.textContent = "@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.15}}";
    document.head.appendChild(stl);
    document.body.insertAdjacentHTML("beforeend", html);
    setTimeout(function () { document.querySelectorAll("[style*='fall']").forEach(function (e) { }); stl.remove(); }, 100);
    setTimeout(function () {
      document.querySelectorAll("body > span").forEach(function (el) { if (el.style.animation && el.style.animation.indexOf("fall") >= 0) el.remove(); });
    }, 3400);
  };
})();

</script>
