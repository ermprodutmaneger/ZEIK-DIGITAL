    ["clinica", /clinica|consultorio|policlinic|laborator|analises clin|fisioter|psicolog|psicanal|fonoau|nutricion|raio x|ultrassom|ecograf|vacina|enfermag|clin med|medic|optometr|oculista|oftalmolog|podolog|acupunt|diagnos|exame|cardio|pediatr|dermatolog|ortoped|gineco|urolog|endocrin|geriatr|pronto ?atendimento|pronto Socorro|saude (mental|da mulher|da familia)|home care|cirurg|estetoscopio|clinico geral/],
    ["varejo", /loja|boutique|moda|roupas|calcado|otica|otico|joalheria|relojoaria|utilidades|presentes|flores|floricult|viveiro|moveis|eletrodomestic|informatica|papelaria|livraria|material (escolar|papel|construcao|de expediente)|cosmetico|perfumaria|artigos( de)?|magazine|shopping|brecho|bazar|souvenir|materiais/],
    ["servicos", /servico|reforma|eletricista|eletrica|encanador|serralher|pintor|pintura|vidracaria|vidrac|limpeza|lavanderia|tinturaria|costura|costureira|alfaiat|chaveiro|dedetiza|imobiliaria|contab|contador|advog|juridic|seguros|grafica|impressao|fotograf|filmagem|assistencia tecnica|conserto|manutencao|instalac|montagem|frete|mudanca|transporte|taxis|lotacao|seguranca|vigilancia|portaria|copiadora|traduc|digitacao|corretor|consorcio|banco|loteria|loterica|cartorio|secagem|representac|engenharia|arquitet|impermeab|desentupidora|desinch|guincho|reboque|zelador|faxina/],
    ["excluido", /^igreja|^paroquia|templo|missao evangel|ministerio|associacao de moradores|assoc de pais|^apm |condominio|sindicato|society|campestre|^cmef|^ee |^emef|^prof |^cre |^drem|^nudire|fundacao|^ong |^asso$|exaltacao|testemunhas|assembleia de deus|catolic/]
  ];

  /* Nicho -> rótulo (a UI mostra o nome bonito, o código usa o id). */
  function nichoLabel(id) {
    for (var i = 0; i < NICHOS.length; i++) if (NICHOS[i].id === id) return NICHOS[i];
    return { id: id, nome: id, emoji: "🏷️" };
  }

  function nichoDe(p) {
    if (!p) return "outro";
    if (p.nicho) return p.nicho;
    var x = NOME_LIMPO(p.nome, p.obs, p.cnae, p.racao, p.descricao, p.atividade);
    for (var i = 0; i < RE_NICHO.length; i++) if (RE_NICHO[i][1].test(x)) return RE_NICHO[i][0];
    var seg = String(p.segmento || "");
    if (seg === "barbearia") return "barbearia";
    if (seg === "salao") return /lash|brow|sobrancelha|cilios/i.test(String(p.nome || "")) ? "lash" : "salao";
    if (seg === "estetica") return "estetica";
    if (seg === "odonto") return "odonto";
    if (seg === "pet") return "pet";
    if (seg === "auto") return "auto";
    if (seg === "constru") return "constru";
    if (seg === "academia") return "academia";
    if (seg === "escola") return "escola";
    if (seg === "food") return "restaurante";
    return "outro";
  }

  /* O padrão vem do NICHOS[].fora; a escolha dele no config manda por cima
     (nichosFora: [] = "pode chamar todo mundo de novo"). */
  function nichosFora(cfg) {
    if (cfg && Array.isArray(cfg.nichosFora)) return cfg.nichosFora.slice();
    var d = [];
    for (var i = 0; i < NICHOS.length; i++) if (NICHOS[i].fora) d.push(NICHOS[i].id);
    return d;
  }

  function nichoBloqueado(p, cfg) {
    var fora = nichosFora(cfg);
    if (!fora.length) return false;
    return fora.indexOf(nichoDe(p)) >= 0;
  }

  /* Contagem por nicho: pra regra dos 500 ele precisa saber quantos leads
     UTILIZAVEIS existem, não quantos cadastros existem. */
  function nichoResumo(lista, cfg) {
    var por = {}, i, id;
    lista = lista || [];
    for (i = 0; i < lista.length; i++) {
      id = nichoDe(lista[i]);
      por[id] = (por[id] || 0) + 1;
    }
    var arrFora = nichosFora(cfg), fora = {};
    for (i = 0; i < arrFora.length; i++) fora[arrFora[i]] = 1;
    var travados = 0, nomes = [];
    Object.keys(por).sort(function (a, b) { return por[b] - por[a]; }).forEach(function (k) {
      if (fora[k]) { travados += por[k]; nomes.push(k + ":" + por[k]); }
    });
    return { por: por, travados: travados, nomes: nomes, fora: arrFora.slice(), total: lista.length, disponiveis: lista.length - travados };
  }


  /* ------------------------------------------------------------------ */
  /* CHAMÁVEL — a regra dele, rodada 7                                    */
  /* "quero só WhatsApp": número fixo não abre conversa, então lead sem    */
  /* celular confirmado não é prospect, é ficha de trabalho. O painel      */
  /* passa a contar CHAMÁVEL = tem número de celular + nicho liberado +    */
  /* não marcado como "não tem WhatsApp". É este número que vira meta,     */
  /* não a contagem de cadastros (que enchia os olhos e não a agenda).     */
  /* ------------------------------------------------------------------ */
  function ehChamavel(p, cfg) {
    if (!p) return false;
    if (p.whatsOk === "nao") return false;
    if (!numWhatsapp(p)) return false;
    return !nichoBloqueado(p, cfg);
  }

  function resumoChamavel(prospects, cfg) {
    var todos = (prospects || []).filter(function (p) { return ehRaio(p, cfg); });
    var semWhats = todos.filter(function (p) { return !numWhatsapp(p) && p.whatsOk !== "nao"; });
    var nichoFora = todos.filter(function (p) { return nichoBloqueado(p, cfg); });
    var cham = todos.filter(function (p) { return ehChamavel(p, cfg); });
    return {
      noRaio: todos.length, chamaveis: cham.length,
      soFixo: semWhats.length, travadosPorNicho: nichoFora.length,
      quentes: cham.filter(function (p) { return ehQuente(p, cfg); }).length,
      mornos: cham.filter(function (p) { return !ehQuente(p, cfg); }).length,
      /* anel vizinho: quente, com celular, só que fora dos bairros do raio — ele
         decide na hora se atende (a fila sem 📍 já leva), o número tem que aparecer */
      quentesFora: (prospects || []).filter(function (p) { return !ehRaio(p, cfg) && numWhatsapp(p) && !nichoBloqueado(p, cfg) && ehQuente(p, cfg); }).length,
      semSite: cham.filter(function (p) { return p.temSite === false; }).length
    };
  }

  /* ------------------------------------------------------------------ */
  /* LEAD QUENTE — a régua do "vai tá doido pra ter um site"             */
  /* Ele cansou de lead morno: "só coloque lead quente". Então o painel  */
  /* para de fingir que todo CNPJ sem site é oportunidade. Cada ponto é  */
  /* um sinal que dá pra apontar o dedo, não um palpite:                 */
  /*   nicho que VIVE de agendamento  = site com horário paga a fatura   */
  /*   sem site                       = a oportunidade existe           */
  /*   já vendendo pelo zap/IG        = já gasta energia com marketing   */
  /*   MEI / dono atende              = quem ouve é quem assina         */
  /*   celular confirmado             = dá pra falar hoje               */
  /* Abaixo do mínimo o lead continua na base (com script) — só não      */
  /* desperdiça o disparo do dia dele.                                   */
  /* ------------------------------------------------------------------ */
  var QUENTE_PONTOS = {
    lash: 6, manicure: 6, estetica: 5, clinica: 5, odonto: 5, academia: 4,
    escola: 4, pet: 4, restaurante: 3, lanchonete: 3, padaria: 2, servicos: 2,
    varejo: 2, constru: 2, auto: 2, merceria: 1, mercearia: 1, outro: 0,
    /* travados por nicho ganham negativo: se ele liberar o nicho, ainda tem que
       provar que é quente — a lista liberada não virar lista aberta */
    barbearia: -4, salao: -4, pizzaria: -4
  };

  /* O obs do seed carrega instrução minha ("testar no wa.me e marcar 🟢", "o guia
     publica…"). Nada disso é sinal de que o dono quer um site — e a régua chegava
     em 12 pontos pra TODO mundo por causa disso. Antes de pontuar, fora a burocracia. */
  /* A nota do cadastro é [sinal real do negócio] · [burocracia minha]. O corte é no
     primeiro marcador de burocracia — o que vem depois não é fato do lead, é
     instrução minha, e não pode virar ponto. */
  var OBS_LIXO = /cadastro ?p[úu]blico|telefone de registro|telefone do an[úu]ncio|o guia (publica|lista|traz)|n[úu]mero de registro|wa\.me|conferir no|confirmar no|solutudo|apontador|endlista|coleta \d|rodada \d/i;
  function obsUtil(p) {
    var raw = String((p && p.obs) || "");
    var m = raw.search(OBS_LIXO);
    if (m > 0) raw = raw.slice(0, m);
    else if (m === 0) return "";
    return raw.replace(/[,;:·•]+\s*$/, "");
  }

  function quenteDe(p, cfg) {
    var mot = [], t = 0;
    if (!p) return { quente: false, pontos: 0, motivo: [] };
    if (p.temSite === true) return { quente: false, pontos: -1, motivo: ["já tem site"] };
    var n = nichoDe(p);
    t += QUENTE_PONTOS[n] || 0;
    if (QUENTE_PONTOS[n] >= 4) mot.push(nichoLabel(n).emoji + " " + nichoLabel(n).nome + " vive de agendamento");
    var x = NOME_LIMPO(p.nome, obsUtil(p), p.instagram, p.cnae, p.racao, p.descricao, p.site);
    /* "insta" sozinho pegava "INSTALAÇÃO elétrica" e inflava o score de eletricista —
       agora é a palavra Instagram inteira (ou "@loja" digitada no campo insta). */
    if (/instagram|(^| )insta($| )|social|perfil|seguidor/.test(x) || /(^|[^a-z0-9.])@[a-z0-9._]+/.test(String(p.instagram || ""))) { t += 3; mot.push("📸 já investe em imagem (rede social) e não tem site"); }
    if (/ifood|delivery|encomenda|catalogo|marca propria|pedido pelo zap|orcamento pelo zap|agend|reserva|marcar/.test(x)) { t += 3; mot.push("vende pelo zap — site organiza e fecha sozinho"); }
    if (/guincho|24 ?h|socorro|emergenc|urgente|desentupidora|chaveiro|reboque/.test(x)) { t += 3; mot.push("cliente procura no Google na hora da necessidade — sem site, ele liga pro concorrente"); }
    if (/restaurante|lanchonete|cardapio|ifood|delivery|comida caseira|marmita|padaria|confeitaria/.test(x)) { t += 2; mot.push("🍽️ cardápio: o cliente decide no Google antes de sair de casa"); }
    if (/\bmei\b|micro empresa|dono atende|quem decide/.test(x)) { t += 1; mot.push("dono = quem decide (não tem que passar por gerente)"); }
    if (p.prioridade === "alta") t += 1;
    if (p.whatsOk === "sim") { t += 2; mot.push("🟢 WhatsApp confirmado"); }
    else if (numWhatsapp(p)) { t += 1; mot.push("🔎 tem celular (falta confirmar o zap)"); }
    if (ehRaio(p, cfg)) { t += 1; mot.push("dentro do seu raio (dá pra visitar hoje)"); }
    var minimo = (cfg && cfg.quenteMinimo) || 7;
    return { quente: t >= minimo, pontos: t, minimo: minimo, nicho: n, motivo: mot };
  }

  function ehQuente(p, cfg) { return quenteDe(p, cfg).quente; }

  /* ------------------------------------------------------------------ */
  /* ROTEIRO POR NICHO — a abordagem que dá vontade                       */
  /* O config.rota é o esqueleto geral (bom pra oficina, mercadinho,      */
  /* pintor). Pra quem vive de agenda — lash, unha, estética, salão — o   */
  /* argumento que derruba não é "site bonito": é DONO DA CLIENTE. Elas   */
  /* pagam comissão por reserva num app que guarda o contato delas, e a   */
  /* manutenção (que é a renda recorrente) é o app quem cobra. A cópia     */
  /* abaixo fala disso, na ordem do que faz querer: (1) eu vi o SEU       */
  /* trabalho, (2) está vazando dinheiro AQUI, (3) a solução é sua e não  */
  /* do app, (4) risco zero — a prévia é sua nem que você diga não. Nenhuma*/
  /* linha tem preço na 1ª: {{valorZeik}} só aparece se ele ligar a rota   */
  /* de preço, e o gatilho é o lugar dele.                                 */
  /* ------------------------------------------------------------------ */
  var ROTA_NICHO = {
    _beleza: {
      nome: "Agenda de beleza (lash · unha · sobrancelha · estética)",
      emoji: "👁️",
      m1: "{{saud}} {{contato}}! Aqui é {{nomeZeik}}, faço site pra quem atende com hora marcada aqui no {{bairro}}. Dei uma olhada no trabalho da {{empresa}}: {{achado}}.\n\nTem um detalhe que quase ninguém repara nisso: quem reserva pelo app é cliente do APP, não seu. Na manutenção seguinte, a mensagem sai do aplicativo, e a comissão de cada serviço fica lá dentro — mesmo com a cliente que já é sua de anos.\n\nO que eu monto pra {{empresa}}: página com seus serviços e valores, fotos de antes/depois e um botão de reagendar que cai direto no SEU WhatsApp. A cliente volta sozinha, sem intermediário e sem taxa por reserva.\n\n{{provaLocal}} Não te peço decisão por texto: eu monto e te mando o link pra abrir aí no celular. Se você não curtir, fica com a prévia e eu te incomodo de novo nunca 🙂",
      gatilho: "{{contato}} caiu na mensagem automática 😄 então vou direto no número: se 2 clientes por semana fecham pelo app em vez de fecharem com você, é comissão paga por gente que já era sua. {{valorZeik}}A página da {{empresa}} já está montada com 3 serviços e o botão de reagendar. Quer que eu mande o link? Você abre em 40 segundos e me diz se vale a pena.",
      followup: "{{contato}}, só passando aqui: deixei a prévia da {{empresa}} guardada (com seus serviços e o botão de agendar). Se não for a hora, me avisa e eu te deixo em paz — te chamo quando mudar alguma coisa no bairro. Se você já montou o site por conta, me manda o link que eu te digo o que está te custando cliente, sem cobrar nada.",
      reuniao: "Perfeito. Te proponho {{doisHorarios}} — 20 minutos, no WhatsApp ou aí na {{empresa}}. Levo o site aberto no celular e a gente olha JUNTAS as fotos de antes/depois que vão na home. Qual dos dois fica melhor?"
    },
    lash: "_beleza", manicure: "_beleza", estetica: "_beleza", salao: "_beleza"
  };

  /* nicho -> cópia ("_chave" é só pra não duplicar texto no arquivo) */
  function rotaNichoDe(nicho) {
    var r = ROTA_NICHO[nicho];
    if (!r) return null;
    if (typeof r === "string") r = ROTA_NICHO[r];
    return r || null;
  }

  /* A função que a UI chama no lugar de config.rota[tipo]. Devolve a cópia do
     nicho quando existe e está ligada; senão, o padrão global. */
  function rotaPara(p, tipo, cfg) {
    tipo = tipo || "m1";
    var base = (cfg && cfg.rota) || {};
    if (!cfg || cfg.rotaPorNicho === false || !p) return base[tipo] || "";
    var r = rotaNichoDe(nichoDe(p));
    return (r && r[tipo]) || base[tipo] || "";
  }

  /* ------------------------------------------------------------------ */
  /* VALIDADE, JANELA, LINK DO MODELO, MEDIÇÃO                          */
  /* ------------------------------------------------------------------ */
  function slug(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 46) || "lead";
  }
  /* Quando a pessoa dona do negócio está com o celular na mão. Chumbo na hora errada
     é lido como spam; na hora certa é lido como "ele sabe como meu dia funciona". */
  var JANELAS = {
    salao: [11, 13, 17, 20], lash: [11, 13, 17, 20], manicure: [11, 13, 17, 20],
    estetica: [11, 13, 17, 20], clinica: [8, 11, 17, 19], odonto: [8, 11, 17, 19],
    auto: [8, 10, 16, 18], servicos: [8, 10, 16, 18], constru: [7, 9, 16, 18],
    varejo: [9, 11, 17, 20], food: [10, 11, 15, 17], academia: [6, 9, 17, 21],
    escola: [8, 11, 17, 20], pet: [9, 11, 16, 19], padaria: [14, 16, 20, 22],
    mercearia: [14, 16, 20, 22], restaurante: [10, 11, 15, 17], lanchonete: [10, 11, 15, 17]
  };
  function janelaIdeal(nicho, quando) {
    var h = JANELAS[nicho] || [9, 11, 16, 18];
    var hh = (quando ? new Date(quando) : new Date()).getHours();
    var dentro = (hh >= h[0] && hh < h[1]) || (hh >= h[2] && hh < h[3]);
    return {
      dentro: dentro,
      texto: "janela dela: " + h[0] + "\u2013" + h[1] + "h e " + h[2] + "\u2013" + h[3] + "h",
      hora: hh
    };
  }
  /* Lead tem prazo. O número dela pode ter mudado, o app pode ter trocado de dono, e
     outro vendedor já pode ter passado na frente. idadeLead() transforma a data da
     coleta em decisão: falar, ou revalidar antes. */
  function parseDataBr(t) {
    var m = String(t || "").match(/(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime() : NaN;
  }
  function idadeLead(p, quando) {
    if (!p) return null;
    var ms = p.coletadoEm ? parseDataBr(p.coletadoEm) : Date.parse(p.criadoEm || "");
    if (!ms || isNaN(ms)) return null;
    return Math.max(0, Math.round(((quando || Date.now()) - ms) / 864e5));
  }
  /* Link PUBLICADO do modelo (só existe se ele apontou o Pages em config.linkBase —
     prometer "está no ar" quando não está seria o tipo de mensagem que queima o cara). */
  function linkModelo(p, cfg) {
    var base = String((cfg && cfg.linkBase) || "").trim();
    if (!base || !p || !p.nome) return "";
    if (!/\/$/.test(base)) base += "/";
    return base + "previas/" + slug(p.nome) + ".html";
  }
  /* Arquivo local gerado por tools/gerar-previas.js — abre no preview e serve de
     ensaio antes de publicar. */
  function linkModeloLocal(p) {
    if (!p || !p.nome) return "";
    return "previas/" + slug(p.nome) + ".html";
  }
  /* Medir a copy sem ele ter que preencher nada: a "versão" é o CRC do próprio texto.
     Editou uma palavra? Nova versão, contador zerado. É o único jeito honesto de saber
     se a abordagem nova funcionou, e o custo é uma linha. */
  function chaveRoteiro(texto, nicho, tipo) {
    var t = String(texto || "");
    return (tipo || "m1") + "|" + (nicho || "geral") + "|" + crc16(t);
  }
  function decodificaChave(ch) {

    u.rate = Number(cfg.velocidade || 1.05);
    u.pitch = 1 + Number(cfg.tom || 0) * 0.12;
    window.speechSynthesis.speak(u);
    if (o.botao) {
      var b = o.botao;
      b.classList.add("speaking");
      u.onend = u.onerror = function () { b.classList.remove("speaking"); };
    }
    return true;
  }
  function pararFala() { if (vozOK()) window.speechSynthesis.cancel(); }
  if (vozOK()) {
    window.speechSynthesis.onvoiceschanged = function () {
      vozCache = window.speechSynthesis.getVoices() || [];
      var sel = document.querySelector("[data-voz-lista]");
      if (sel) renderVozes(sel);
    };
  }
  function renderVozes(sel) {
    var cfg = (S && S.state.config && S.state.config.voz) || {};
    var lista = (vozCache || (vozOK() ? window.speechSynthesis.getVoices() : []) || []);
    var pt = lista.filter(function (v) { return /^pt/i.test(v.lang); });
    var usar = (pt.length ? pt : lista).slice(0, 40);
    sel.innerHTML = '<option value="">voz padrão do aparelho</option>' + usar.map(function (v) {
      return '<option value="' + esc(v.name) + '"' + (cfg.preferida === v.name ? " selected" : "") + '>' + esc(v.name) + " · " + esc(v.lang) + '</option>';
    }).join("");
  }

  /* ------------------------------ NAVEGAÇÃO ---------------------------- */
  var routes = ["dashboard", "prospeccao", "disparo", "pipeline", "clientes", "financeiro", "tarefas", "scripts", "gerador", "config"];
  function currentView() {
    var h = (location.hash || "").replace(/^#\/?/, "").split("?")[0];
    return routes.indexOf(h) >= 0 ? h : "dashboard";
  }
  var _navSuppressed = false;
  function go(view) {
    var target = "#/" + view;
    if (location.hash !== target) {
      _navSuppressed = true;
      location.hash = target;
      setTimeout(function () { _navSuppressed = false; }, 0);
    }
    render();
  }

  /* ---------------------------- LOCK (PIN) ----------------------------- */
  function showLock() {
    var el = document.getElementById("lockScreen");
    if (el) { el.classList.remove("hidden"); document.getElementById("app").setAttribute("aria-hidden", "true"); return; }
    var d = document.createElement("div");
    d.id = "lockScreen"; d.className = "lock";
    d.innerHTML = '<div class="card lock-card"><div class="brand-logo" style="width:46px;height:46px;font-size:22px">Z</div>' +
      '<div><h2 style="margin-bottom:2px">Zeik Digital</h2><p class="tiny" style="margin:0">Painel protegido. Digite seu PIN de 4 a 8 dígitos.</p></div>' +
      '<form id="lockForm" autocomplete="off"><input type="password" inputmode="numeric" id="lockPin" placeholder="••••" maxlength="8" aria-label="PIN">' +
      '<button class="btn block" style="margin-top:10px" type="submit">Entrar</button></form>' +
      '<p class="tiny" id="lockMsg" style="min-height:16px;margin:0"></p></div>';
    document.body.appendChild(d);
    document.getElementById("app").setAttribute("aria-hidden", "true");
    document.getElementById("app").style.filter = "blur(14px)";
    var form = document.getElementById("lockForm");
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var pin = document.getElementById("lockPin").value;
      S.lockCheck(pin).then(function (r) {
        var msg = document.getElementById("lockMsg");
        if (r === true) {
          d.remove();
          document.getElementById("app").removeAttribute("aria-hidden");
          document.getElementById("app").style.filter = "";
          msg.textContent = "";
          toast("Bem-vindo de volta 👋", "ok");
        } else if (r && r.wait) {
          msg.textContent = "Muitas tentativas. Espere " + r.wait + "s e tente de novo.";
        } else {
          msg.textContent = "PIN errado. " + (r && r.left != null ? "Tentativas restantes: " + r.left : "");
          document.getElementById("lockPin").select();
        }
      });
    });
    setTimeout(function () { document.getElementById("lockPin").focus(); }, 100);
  }

  /* -------------------------------- PWA -------------------------------- */
  function registerPWA() {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol === "file:") return;
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* silencioso: painel funciona sem SW */ });
    });
  }

  /* ------------------------------- BOOT -------------------------------- */
  var booted = false;
  /* Trava por inatividade: aparelho na mão de outra pessoa = tela bloqueada. */
  var ultimoToque = Date.now();
  function marcarAtividade() { ultimoToque = Date.now(); }
  function iniciarAutoLock() {
    ["pointerdown", "keydown"].forEach(function (ev) { document.addEventListener(ev, marcarAtividade, { passive: true }); });
    setInterval(function () {
      var cfg = (S && S.state.config) || {};
      var min = Number(cfg.lockInatividade || 0);
      if (!min || !S || !S.lockAtivo || !S.lockAtivo()) return;
      if (document.hidden || document.getElementById("lockScreen") || document.getElementById("privadoAviso")) return;
      if (Date.now() - ultimoToque > min * 60000) travarPorInatividade();
    }, 20000);
  }
  function travarPorInatividade() {
    var d = document.createElement("div");
    d.id = "privadoAviso";
    d.style.cssText = "position:fixed;inset:0;background:#0b1020;color:#fff;z-index:90;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;font:600 16px system-ui";
    d.innerHTML = '<div><div style="font-size:40px">🔒</div><p style="margin:10px 0 16px">Base privada do Zeik — travada por inatividade.</p><button class="btn" type="button">Destravar</button></div>';
    d.querySelector("button").addEventListener("click", function () { d.remove(); showLock(); });
    document.body.appendChild(d);
  }

  function boot() {
    if (modoInstalado()) document.querySelectorAll("[data-act='instalar-app']").forEach(function (b) { b.textContent = "✓ App instalado neste aparelho"; b.classList.add("quiet"); });
    if (booted) return; booted = true;
    S = window.ZeikStore;
    S.init(window.ZEIK_SEED);

    if (S.lastError) toast(S.lastError, "warn", 6000);
    if (S._upgradeMsg) toast(S._upgradeMsg, "ok", 9000);
    iniciarAutoLock();
    if (!S.storageOK()) toast("Armazenamento local bloqueado neste navegador — use sem salvar ou saia do modo privado.", "err", 9000);

    var lock = S.lockGet();
    if (lock && lock.hash) { showLock(); }

    window.addEventListener("hashchange", function () { if (!_navSuppressed) render(); });
    document.addEventListener("click", onClick);
    document.addEventListener("input", onInput);
    document.addEventListener("keydown", onKey);
    window.addEventListener("beforeunload", function (e) {
      // salva imediatamente caso o usuário feche rápido depois de digitar
      try { S.saveNow(); } catch (err) {}
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") { try { S.saveNow(); } catch (e) {} }
      else if (window.App && App.refreshBadges) App.refreshBadges();
    });

    registerPWA();
    render();
    if (window.App && App.initAfter) App.initAfter();
  }

  /* Delegação central de cliques */
  function onClick(ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) { if (document.body.classList.contains("nav-open") && !ev.target.closest("#sidebar")) document.body.classList.remove("nav-open"); return; }
    var act = t.getAttribute("data-act");
    if (act === "nav") {
      ev.preventDefault();
      document.body.classList.remove("nav-open");
      go(t.getAttribute("data-view"));
      return;
    }
    if (act === "toggle-nav") { document.body.classList.toggle("nav-open"); document.getElementById("scrim").classList.toggle("hidden"); return; }
    if (act === "fechar-nav") { document.body.classList.remove("nav-open"); document.getElementById("scrim").classList.add("hidden"); return; }
    if (act === "close") { closeModal(); return; }
    if (window.App && App.handlers && App.handlers[act]) {
      App.handlers[act](t, ev);
      ev.preventDefault();
    }
  }
  var onInputDebounced = debounce(function () { if (window.App && App.onFilterInput) App.onFilterInput(); }, 220);
  function onInput(ev) {
    var t = ev.target;
    if (t.matches("[data-filter]")) onInputDebounced();
    if (t.matches("[data-autosave]")) {
      var path = t.getAttribute("data-autosave");
      S.pushUndo("editar campo");
      setByPath(S.state, path, t.type === "checkbox" ? t.checked : (t.type === "number" ? Number(t.value) || 0 : t.value));
      S.save();
    }
  }
  function onKey(ev) {
    if (ev.key === "Escape" && modalStack.length) { closeModal(); return; }
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); var s = document.querySelector("[data-filter=search]"); if (s) { go("prospeccao"); setTimeout(function () { document.querySelector("[data-filter=search]").focus(); }, 120); } }
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "s") { ev.preventDefault(); S.saveNow(); toast("Painel salvo ✔", "ok"); }
    if ((ev.metaKey || ev.ctrlKey) && ev.altKey && ev.key.toLowerCase() === "z") { ev.preventDefault(); if (S.undo()) { render(); toast("Alteração desfeita", "ok"); } }
  }
  function setByPath(obj, path, val) {
    var keys = path.split("."); var last = keys.pop(); var cur = obj;
    for (var i = 0; i < keys.length; i++) { if (!cur[keys[i]]) cur[keys[i]] = {}; cur = cur[keys[i]]; }
    cur[last] = val;
  }

  function render() {
    if (window.App && App.render) App.render();
  }

  window.ZeikUI = {
    toast: toast, openModal: openModal, closeModal: closeModal, closeAllModals: closeAllModals,
    modalShell: modalShell, confirmBox: confirmBox,
    copy: copy, openWa: openWa, waLinkProspect: waLinkProspect, openTel: openTel, waLink: waLink, openMaps: openMaps, google: google,
    download: download, fillVars: fillVars, scriptCtx: scriptCtx, segById: segById,
    falar: falar, pararFala: pararFala, vozOK: vozOK, limparFala: limparFala,
    saudacao: saudacao, achadoDo: achadoDo,
    renderVozes: renderVozes, mostrarLock: showLock,
    modoInstalado: modoInstalado, pedirInstalacao: pedirInstalacao,
    esc: esc, debounce: debounce, render: render, go: go, currentView: currentView,
    showLock: showLock, get store() { return S; }, boot: boot,
    setDirty: function (v) { dirty = v; }, isDirty: function () { return dirty; }
  };
  window.App = window.App || {};
  var dirty = false;

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
<script>
/* ==========================================================================
   ZEIK DIGITAL — App (views, dashboard, prospecção, kanban + drag&drop)
   Arquivo: assets/js/app.js
   ========================================================================== */
(function () {
  "use strict";

  var App = window.App = window.App || {};
  App.handlers = App.handlers || {};
  App.filters = {
    q: "", bairro: "", segmento: "", status: "", prio: "", need: "", zona: "", canal: "wa", ordem: "score", cidade: "", raio: "", frescos: "",
    cq: "", cstatus: "", fperiodo: "12", tq: "pendentes"
  };

  var ui = function () { return window.ZeikUI; };

  var money = function (v) { return Z.fmtBRL(v); };

  function seg(id) { return ui().segById(id); }
  function badge(txt, color) { return '<span class="badge ' + (color || "") + '">' + esc(txt) + '</span>'; }
  function scoreBar(score) {
    var cls = score >= 75 ? "hi" : score >= 55 ? "mid" : "lo";
    return '<span class="score ' + cls + '" title="Score ICP: quanto maior, mais quente o lead"><span class="bar"><i style="width:' + score + '%"></i></span>' + score + '</span>';
  }

  var STATUS_LABEL = {
    novo: ["Novo", "gray"],
    contato_feito: ["Contato feito", "blue"],
    respondeu: ["Respondeu", "green"],
    Orcamento: ["Orçamento enviado", "orange"],
    sem_retorno: ["Sem retorno", "red"],
    convertido: ["Na negociação", "indigo"],
    cliente: ["Cliente", "purple"],
    adiado: ["Adiado", "orange"]
  };
  function statusPill(s) {
    var d = STATUS_LABEL[s] || STATUS_LABEL.novo;
    return badge(d[0], d[1]);
  }

  /* ====================================================================== */
  /*  RENDER ROOT                                                            */
  /* ====================================================================== */
  App.render = function () {
    var view = ui().currentView();
    App.view = view;
    var host = document.getElementById("view");
    document.body.dataset.view = view;
    var html = "";
    switch (view) {
      case "prospeccao": html = viewProspect(); break;
      case "pipeline": html = viewPipeline(); break;
      case "clientes": html = viewClientes(); break;
      case "financeiro": html = viewFinanceiro(); break;
      case "tarefas": html = viewTarefas(); break;
      case "scripts": html = viewScripts(); break;
      case "disparo": html = viewDisparo(); break;
      case "gerador": html = viewGerador(); break;
      case "config": html = viewConfig(); break;
      default: html = viewDashboard();
    }
    host.innerHTML = html;
    document.querySelectorAll(".nav-item").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === view);
    });
    var scrim = document.getElementById("scrim");
    if (scrim) scrim.classList.toggle("hidden", !document.body.classList.contains("nav-open"));
    App.refreshBadges();
    App.renderSearchActive();
    if (view === "pipeline") bindDragDrop();
    App.ensureTick();
    if (view === "dashboard" || view === "financeiro") bindSliders();
    if (view === "prospeccao" || view === "clientes" || view === "tarefas" || view === "scripts") { /* inputs delegados */ }
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  };

  App.refreshBadges = function () {
    var s = st(), S = window.ZeikStore, S_ = S.stats();
    var map = {
      prospeccao: s.prospects.filter(function (p) { return p.status === "novo"; }).length,
      pipeline: s.deals.filter(function (d) { return ["lead", "contatado", "proposta"].indexOf(d.etapa) >= 0; }).length,
      clientes: s.clientes.length,
      financeiro: s.financeiro.filter(function (f) { return f.status === "a_receber"; }).length,
      tarefas: s.tarefas.filter(function (t) { return !t.concluida && Z.diasAteData(t.data) <= 1; }).length,
      disparo: (s.campanhas || []).reduce(function (n, c) { return n + c.itens.filter(function (x) { return x.estado === "na fila"; }).length; }, 0)
    };
    document.querySelectorAll("[data-count]").forEach(function (el) {
      var k = el.getAttribute("data-count");
      var v = map[k];
      if (v === undefined) return;
      el.textContent = v;
      el.style.display = v ? "" : "none";
      if (k === "tarefas") el.classList.toggle("badge", false);
    });
    var stEl = document.getElementById("saveStatus");
    if (stEl) {
      var err = window.ZeikStore.lastError;

    }
  };
  App.renderSearchActive = function () {
    var i = document.querySelector("[data-filter=search]");
    if (i && i.value !== App.filters.q) i.value = App.filters.q;
  };

  function topbar(title, sub, actions) {
    return '<div class="topbar"><div><h1>' + esc(title) + '</h1><div class="sub">' + sub + '</div></div>' +
      '<div class="topbar-actions">' + (actions || "") + '</div></div>';
  }

  /* ====================================================================== */
  /*  DASHBOARD                                                              */
  /* ====================================================================== */
  function viewDashboard() {
    var S = window.ZeikStore, s = st(), m = S.stats(), cfg = s.config;
    var hoje = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

    var kpis = [
      ["Prospects na lista", m.prospects, "blue", m.prospectNovos + " ainda não contatados", 0],
      ["Em negociação", m.emNegociacao, "cyan", m.propostas + " proposta(s) enviada(s)", 0],
      ["Ganhos (mês)", m.sitesMes, "green", m.ganhos + " no total · taxa " + m.taxa + "%", 0],
      ["Faturado no mês", m.totalMes, "indigo", (m.totalMes >= m.totalMesAnterior ? "▲ " : "▼ ") + money(Math.abs(m.totalMes - m.totalMesAnterior)) + " vs mês passado", 1],
      ["A receber", m.aReceber, "orange", s.financeiro.filter(function (f) { return f.status === "a_receber"; }).length + " lançamento(s)", 1],
      ["MRR (manutenções)", m.mrr, "purple", m.comManut + " cliente(s) a " + money(cfg.manutMes) + "/mês", 1],
      ["Prontos p/ WhatsApp", m.comWhats, "green", m.soFixo + " só com fixo · " + m.semContato + " sem número", 0]
    ].map(function (k) {
      return '<div class="card kpi accent-' + k[2] + ' hoverable"><div class="label">' + k[0] + '</div><div class="value">' +
        (k[4] ? money(k[1]) : k[1]) + '</div><div class="delta">' + esc(k[3]) + '</div></div>';
    }).join("");

    /* gráfico 6 meses */
    var max = Math.max.apply(null, m.porMes.map(function (x) { return Math.max(x.pago, x.receber); }).concat([1]));
    var chart = m.porMes.map(function (x, i) {
      var last = i === m.porMes.length - 1;
      var h = Math.round((x.pago / max) * 118) + 3;
      var hr = Math.round((x.receber / max) * 118);

        '<div class="bar-val">' + (x.pago ? (x.pago >= 1000 ? (x.pago / 1000).toFixed(1).replace(".0", "") + "k" : x.pago) : "") + '</div>' +
        '<div style="width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;height:126px;gap:3px">' +
        (x.receber ? '<div style="height:' + Math.max(hr, 3) + 'px;border-radius:8px 8px 4px 4px;background:rgba(255,149,0,.45)" title="A receber"></div>' : "") +
        '<div class="bar' + (last ? " current" : "") + '" style="height:' + h + 'px"></div></div>' +
        '<div class="bar-lbl">' + esc(x.label) + '</div></div>';
    }).join("");

    /* meta */
    var pctMeta = Math.min(100, Math.round((m.sitesMes / (cfg.metaSitesMes || 1)) * 100));

    /* funil */

    var fun = etps.map(function (e) {
      var n = s.deals.filter(function (d) { return d.etapa === e; }).length;
      return { nome: S.Etapas[e].nome, n: n };
    });
    var maxFun = Math.max.apply(null, fun.map(function (x) { return x.n; }).concat([1]));
    var funil = fun.map(function (x, i) {

        '<div class="li-meta">' + (t.cliente ? esc(t.cliente) + ' · ' : '') + '<span class="badge ' + (d < 0 ? "red" : d === 0 ? "orange" : "blue") + '">' + label + '</span></div></div>' +
        '<div class="li-actions"><button class="btn xs quiet" data-act="tarefa-concluir" data-id="' + t.id + '">✓ Feito</button>' +
        '<button class="btn xs ghost" data-act="tarefa-editar" data-id="' + t.id + '">✏️</button></div></div>';
    }).join("") : '<p class="tiny">Nenhuma tarefa pendente. Use "Agendar follow-up" no Kanban para criar uma.</p>';

    /* quem precisa de atenção (calor do funil de prospecção) */
    var quentes = s.prospects.filter(function (p) { return p.status === "respondeu" || p.status === "Orcamento"; });
    var esfriando = s.prospects.filter(function (p) { return p.status === "contato_feito" && (Z.diasDesde(p.ultimoContato || p.atualizadoEm) || 0) >= 4; });

    var cam = S.campanha();
    var enviadosHoje = cam ? (cam.enviadosHoje || 0) : 0;
    var reunioesHoje = s.prospects.filter(function (p) {
      return p.status === "convertido" && p.ultimoContato && p.ultimoContato.slice(0, 10) === Z.todayISO();
    }).length;
    var rotina = '<div class="card" style="margin-bottom:14px"><div class="card-title">🔁 Rotina do dia (o ciclo do curso, na ordem)</div>' +
      '<div class="row wrap" style="gap:6px">' +

  function slider(key, label, val, min, max, step, moneyFmt) {

  function bindSliders() {

        var s = st(), cfg = s.config;
        var comManut = s.clientes.filter(function (c) { return c.status === "ativo" && c.manutencao; }).length;
        var mrr = comManut * cfg.manutMes;

        inp.closest("label").querySelector("b").textContent = (inp.getAttribute("data-slider") === "sites") ? String(v.sites) : Z.fmtBRL(Number(inp.value));

        var nums = card.querySelectorAll(".kv .v");

  /* ------------------------- drag & drop (ponteiro) -------------------- */
  var drag = null;
  function bindDragDrop() {
    var kan = document.getElementById("kanban");
    if (!kan) return;
    kan.addEventListener("pointerdown", onDown);
  }
  function onDown(ev) {
    var card = ev.target.closest(".kcard");
    if (!card) return;
    if (ev.target.closest("button")) return;              // não arrasta quando clica em ação
    var touch = ev.pointerType !== "mouse";
    var onHandle = !!ev.target.closest("[data-handle]");
    drag = {
      card: card, id: card.getAttribute("data-deal"), from: card.getAttribute("data-etapa"),
      x0: ev.clientX, y0: ev.clientY, started: false, touch: touch, armed: false,
      armedTimer: null, pointerId: ev.pointerId
    };
    if (touch && !onHandle) {
      drag.armedTimer = setTimeout(function () { if (drag) drag.armed = true; }, 240);
    } else if (touch) { drag.armed = true; card.style.touchAction = "none"; }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
    document.addEventListener("touchmove", blockScroll, { passive: false });
  }
  function blockScroll(ev) { if (drag && drag.started && drag.touch) { /* deixa rolar se não começou */ if (ev.cancelable) ev.preventDefault(); } }
  function onMove(ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (!drag.started) {
      if (Math.abs(dx) + Math.abs(dy) < 9) return;
      if (drag.touch && !drag.armed) { cancel(); return; }
      start(ev);
    }
    move(ev);
  }
  function start(ev) {
    drag.started = true;
    clearTimeout(drag.armedTimer);
    var ghost = drag.card.cloneNode(true);
    ghost.id = "dragGhost";
    ghost.className = "kcard";
    ghost.style.width = drag.card.offsetWidth + "px";
    ghost.querySelectorAll("button").forEach(function (b) { b.remove(); });
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.card.classList.add("dragging");
    document.body.style.userSelect = "none";
    move(ev);
  }
  function move(ev) {
    var g = drag.ghost;
    g.style.left = (ev.clientX - 24) + "px";
    g.style.top = (ev.clientY - 18) + "px";
    g.style.position = "fixed";
    drag.card.style.visibility = "hidden";
    var under = document.elementFromPoint(ev.clientX, ev.clientY);
    var col = under && under.closest ? under.closest(".kcol") : null;
    document.querySelectorAll(".kcol.drop").forEach(function (c) { if (c !== col) c.classList.remove("drop"); });
    drag.over = col ? col.getAttribute("data-col") : null;
    if (col) col.classList.add("drop");
  }
  function onUp() {
    if (!drag) return;
    if (drag.started) {
      var target = drag.over;
      var id = drag.id, from = drag.from;
      cancel();
      if (target && target !== from) App.moveDeal(id, target);
      else render();
    } else {
      var tocado = drag.id;
      cancel();
      App.modalDeal(tocado);          // toque simples no card abre o negócio
    }
  }
  function cancel() {
    if (!drag) return;
    clearTimeout(drag.armedTimer);
    if (drag.ghost) drag.ghost.remove();
    if (drag.card) { drag.card.classList.remove("dragging"); drag.card.style.visibility = ""; drag.card.style.touchAction = ""; }
    document.querySelectorAll(".kcol.drop").forEach(function (c) { c.classList.remove("drop"); });
    document.body.style.userSelect = "";
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", blockScroll);
    drag = null;
  }

  App.moveDeal = function (id, novaEtapa) {
    var S = window.ZeikStore, s = st();
    var d = s.deals.filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    if (!S.Etapas[novaEtapa]) { ui().toast("Etapa desconhecida — nada foi movido.", "warn", 4000); render(); return; }
    var anterior = d.etapa;
    if (anterior === novaEtapa) return;
    S.pushUndo("mover card");
    d.etapa = novaEtapa;
    d.ordem = Date.now() % 100000;
    d.atualizadoEm = new Date().toISOString();
    d.historico = (d.historico || []); d.historico.push({ etapa: novaEtapa, em: d.atualizadoEm });
    S.log("pipeline", d.empresa + ": " + ((S.Etapas[anterior] || {}).nome || anterior) + " → " + S.Etapas[novaEtapa].nome, d.id);
    S.saveNow();

    if (novaEtapa === "contatado") { App.modalFollowUp(d, anterior); return; }
    if (novaEtapa === "proposta") {
      App.modalProposta(d); return;
    }
    if (novaEtapa === "ganho") { App.modalGanho(d); return; }
    if (novaEtapa === "perdido") { App.modalPerdido(d); return; }
    render();
    ui().toast("Movido para " + S.Etapas[novaEtapa].nome, "ok");
  };

  App.handlers["nicho-fora-toggle"] = function (el) {
    var id = el.getAttribute("data-nicho"); if (!id) return;
    var cfg = st().config, atual = Z.nichosFora(cfg), i = atual.indexOf(id);
    if (el.checked && i < 0) atual.push(id);
    if (!el.checked && i >= 0) atual.splice(i, 1);
    cfg.nichosFora = atual;
    window.ZeikStore.save();
    render();
    U.toast(atual.length ? "🚫 Fora da fila agora: " + atual.join(", ") : "Peneira desligada — todo nicho volta pra fila.", "info", 5000);
  };
  App.handlers["p-whats-ok"] = function (el) {
    var p = window.ZeikStore.marcarWhats(el.getAttribute("data-id"), "sim");
    render();
    U.toast(p ? "🟢 " + p.nome + " confirmado com WhatsApp ativo — entra na fila na frente." : "Lead não encontrado.", "ok", 4000);
  };
  App.handlers["p-whats-nao"] = function (el) {
    var p = window.ZeikStore.marcarWhats(el.getAttribute("data-id"), "nao");
    render();
    U.toast(p ? "✖ " + p.nome + " saiu da fila de WhatsApp. Se ele tiver um celular novo, é só voltar aqui e marcar 🟢." : "Lead não encontrado.", "info", 5000);
  };
  App.handlers["filtro-frescos"] = function () {
    App.filters.frescos = App.filters.frescos ? "" : "1";
    render();
    U.toast(App.filters.frescos ? "Mostrando só quem nunca recebeu mensagem sua." : "Mostrando todos de novo.", "info", 2600);
  };
  App.handlers["marcar-chamados"] = function () {
    var ids = (App._idsDaLista || []).slice();
    if (!ids.length) { U.toast("Nenhum lead na lista — ajuste os filtros antes.", "warn"); return; }
    var r = Z.marcarComoChamados(ids);
    render();
    U.toast("✔ " + r.marcados + " marcados como já chamados" + (r.ja ? " (" + r.ja + " já estavam)" : "") + " — saíram da fila. Os cadastros continuam aqui.", "ok", 6000);
  };
  App.handlers["campanha-pausar"] = function () {
    var S = window.ZeikStore, c = S.campanha(); if (!c) return;
    if (c.proximoAte > Date.now()) { c.proximoAte = 0; ui().toast("Cadência liberada no susto — evite isso, o número percebe.", "err", 6000); }
    else c.proximoAte = Date.now() + 8 * 60000;
    S.saveNow(); App.render();
  };
  App.handlers["campanha-relatorio"] = function () { App.modalRelatorio(); };
  App.handlers["campanha-csv"] = function () {
    var c = window.ZeikStore.campanha(); if (!c) return;
    var linhas = ["nome;telefone;cidade;bairro;estado;tentativas;obs"];
    c.itens.forEach(function (it) {
      var p = st().prospects.filter(function (x) { return x.id === it.prospectId; })[0] || {};
      linhas.push([p.nome || it.nome, it.telefone || "", p.cidade || "São Paulo", p.bairro || "", it.estado, it.tentativas || 0, (it.obs || p.obs || "").replace(/;/g, ",")].join(";"));
    });
    ui().download("zeik-fila-" + Z.todayISO() + ".csv", "" + linhas.join("\n"), "text/csv;charset=utf-8");
    ui().toast("CSV da fila baixado — dá pra abrir no Google Sheets e filtrar por cidade.", "ok", 6000);
  };
  App.handlers["campanha-resultado"] = function () { App.modalResultado(); };
  App.handlers["fila-whatsapp"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var it = c && c.itens[i]; if (!it) return;
    var p = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
    if (!p) { ui().toast("Lead não está mais na base.", "err"); return; }
    var ctx = ui().scriptCtx({ p: p, empresa: p.nome, contato: p.contato || "chefe" });
    var texto = ui().fillVars(Z.rotaPara(p, "m1", st().config) || (st().config.rota || {}).m1 || "Oi {{contato}}, tudo bem? Mandei um modelo de site da {{empresa}} pra você dar uma olhada.", ctx);
    var fone = Z.numWhatsapp(p);
    if (fone) ui().openWa(fone, texto);
    else {
      var alt = Z.canal(p);
      if (alt === "ligar") ui().openTel(p.fixo || p.telefone);
      else if (alt === "insta") ui().google((p.insta || p.nome) + " instagram");
      else ui().copy(texto, "Sem número — mensagem copiada. Cole depois de pegar o celular no balcão.");
      ui().toast("Este lead não tem celular na base. Marque “sem WhatsApp” pra limpar a fila.", "err", 6000);
      return;
    }
    S.marcarItem(c.id, i, "enviado");
    App.agendarProximo(S.campanha(c.id));
    S.log("disparo", "1ª mensagem enviada para " + p.nome, p.id);
    ui().toast("💬 Enviado · cadência ligada", "ok", 4000);
    App.render();
  };
  App.handlers["fila-copiar"] = function (b) {
    var c = window.ZeikStore.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var it = c && c.itens[i]; var p = st().prospects.filter(function (x) { return x.id === it.prospectId; })[0] || {};
    var ctx = ui().scriptCtx({ p: p, empresa: p.nome, contato: p.contato || "chefe" });
    var rota = st().config.rota || {}; var tpl = rota[b.getAttribute("data-tipo")] || rota.m1;
    ui().copy(ui().fillVars(tpl, ctx), (b.getAttribute("data-tipo") === "gatilho" ? "⚡ Gatilho" : "1ª mensagem") + " copiada");
  };
  /* Um toque no botão e o link do modelo vai na área de transferência. Se ele ainda não
     publicou a pasta previas/, a gente copia o caminho relativo e avisa o que falta. */
  App.handlers["fila-link"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), it = c && c.itens[Number(b.getAttribute("data-i"))];
    var p = S.state.prospects.filter(function (x) { return x.id === (it && it.prospectId); })[0];
    if (!p) { ui().toast("Lead não está mais na base.", "err"); return; }
    var u = Z.linkModelo(p, S.state.config);
    if (u) { ui().copy(u, "🔗 Link do modelo da " + p.nome + " copiado. Manda junto com a 1ª mensagem: ela abre na hora e você não precisa explicar nada."); return; }
    var local = Z.linkModeloLocal(p);
    if (window.open(local, "_blank")) {
      ui().toast("👁 Abrindo o modelo local da " + p.nome + ". Pra virar link de verdade: node tools/gerar-previas.js e aponta config.linkBase pro seu Pages.", "ok", 8000);
    } else ui().toast("Sem link publicado ainda. Rode: node tools/gerar-previas.js — e preencha 'link do Pages' em Scripts.", "warn", 7000);
  };
  App.handlers["fila-objecao"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var it = c && c.itens[i]; if (!it) return;
    var obj = b.getAttribute("data-obj") || "outro";
    var p = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
    var r = S.marcarObjecao(it.prospectId, obj);
    if (r) S.statRoteiro(r, "m1", "não");
    S.marcarItem(c.id, i, "não", obj);
    ui().toast("Anotado: “" + obj + "”. " + (obj === "já tenho site"
      ? "Isso não é 'não' — é a oferta errada. Vende a página de agendamento, não o site."
      : obj === "sem grana agora"
        ? "Sem grana hoje = mensalidade. Se ele cobra R$ 90 por serviço, 1 cliente novo por mês paga o site."
        : "“mês que vem” sem data é um não educado. Marca o follow-up e só fale de novo com novidade."), "ok", 7000);
    App.agendarProximo(S.campanha(c.id));
  };
  App.handlers["fila-marcar"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var estado = b.getAttribute("data-estado");
    var it = c && c.itens[i]; if (!it) return;
    var p0 = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
    S.marcarItem(c.id, i, estado);
    if (estado === "enviado") App.agendarProximo(S.campanha(c.id));
    /* Ele respondeu? Se for a mensagem automática do balcão, a próxima é o gatilho. */
    if (estado === "fechou" && p0) {
      ui().toast("🏆 " + p0.nome + " fechou. Agora o nome dela entra na 1ª mensagem dos vizinhos de bairro — é o seu ativo mais caro.", "ok", 8000);
      if (window.ZeikStore.statRoteiro) window.ZeikStore.statRoteiro(p0, "m1", "fechou");
    }
    if (estado === "respondeu" && p0) {
      var ctxR = ui().scriptCtx({ p: p0, empresa: p0.nome, contato: p0.contato || "chefe" });
      var gatilhoTxt = ui().fillVars(Z.rotaPara(p0, "gatilho", st().config) || (st().config.rota || {}).gatilho || "", ctxR);
      if (gatilhoTxt) ui().copy(gatilhoTxt, "⚡ Respondeu: o gatilho (2ª mensagem) já está copiado. Se foi mensagem automática do balcão, mande agora; se foi dúvida de verdade, responda na hora e depois mande o link.");
      if ((st().config.voz || {}).auto) ui().falar(gatilhoTxt, { forcar: false });
      App.agendarProximo(S.campanha(c.id));
    }
    if (estado === "reunião") {
      var el = { getAttribute: function (k) { return k === "data-id" ? it.prospectId : null; } };
      App.handlers["p-converter"](el);
      ui().toast("📅 Reunião marcada: virou negociação no Kanban com a prévia pra montar.", "ok", 6000);
      return;
    }
    if (estado === "sem numero") {
      var p2 = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
      if (p2) App.modalPegarWhats(p2);
      return;
    }
    S.log("disparo", it.nome + " → " + estado, it.prospectId);
    App.render();
  };
  App.handlers["fila-pular"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    if (!c || !c.itens[i]) return;
    var it = c.itens.splice(i, 1)[0];
    it.estado = "adiado"; c.itens.push(it);
    S.saveNow(); App.render(); ui().toast("Jogei pro fim da fila.", "ok", 2500);
  };
  /* A "prévia" é a arma da abordagem: o modelo já montado, baixável e mandável. */
  App.handlers["fila-abrir-site"] = function (b) {
    var S = window.ZeikStore, c = S.campanha(b.getAttribute("data-cam")), i = Number(b.getAttribute("data-i"));
    var it = c && c.itens[i]; if (!it) return;
    var p = S.state.prospects.filter(function (x) { return x.id === it.prospectId; })[0];
    if (!p) return;
    if (!window.ZeikSite || !window.ZeikSite.gerar) { ui().toast("Gerador indisponível neste aparelho.", "err"); return; }
    var html = window.ZeikSite.gerar({
      empresa: p.nome, bairro: p.bairro || p.cidade || "", endereco: p.endereco || "", telefone: Z.foneParaUso(p),
      telefoneFmt: Z.fmtTel(Z.foneParaUso(p)), whatsapp: Z.toWa(Z.numWhatsapp(p) || p.whats || p.telefone),
      segmento: p.segmento, sobre: (seg(p.segmento) || {}).sobre || ""
    });
    var nome = String(p.nome).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 34) + "-modelo.html";
    window.ZeikSite.baixar(nome, html);
    S.log("site", "Baixou o modelo de " + p.nome + " (prévia da abordagem)", p.id);
    ui().toast("🧪 Modelo de " + p.nome + " baixado. Abra no celular e mande como print ou arquivo — é isso que abre a conversa.", "ok", 8000);
    App.render();
  };
  App.handlers["voz-falar"] = function (b) {
    var cfg = st().config;
    var tipo = b.getAttribute("data-tipo") || "m1";
    var texto;
    if (b.getAttribute("data-cam")) {
      var c = window.ZeikStore.campanha(b.getAttribute("data-cam"));
      var it = c && c.itens[Number(b.getAttribute("data-i"))];
      var p = st().prospects.filter(function (x) { return x.id === (it && it.prospectId); })[0] || {};
      texto = ui().fillVars(Z.rotaPara(p, tipo, cfg) || cfg.rota[tipo] || cfg.rota.m1, ui().scriptCtx({ p: p, empresa: p.nome, contato: p.contato || "chefe" }));
    } else texto = ui().fillVars(cfg.rota.m1, ui().scriptCtx());
    if (!ui().falar(texto, { botao: b })) ui().toast("Voz indisponível neste navegador.", "err");
  };
  App.handlers["coletor-abrir"] = function () { App.modalColetor(); };
  App.handlers["ensinar"] = function () { App.modalEnsinar(); };
  App.handlers["jump-disparo"] = function () { ui().go("disparo"); };
  App.handlers["cobrar-abrir"] = function (b) { App.modalCobranca(b.getAttribute("data-pid") || null); };

  App.STATUS_LABEL = STATUS_LABEL;
  App.getPath = getPath;
  App.get = function () { return st(); };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { });
})();

<script>
/* ==========================================================================
   ZEIK DIGITAL — Ações, formulários e modais
   Arquivo: assets/js/modals.js  (usa App.handlers definidos em ui.js/app.js)
   ========================================================================== */
(function () {
  "use strict";

  var App = window.App, U = window.ZeikUI, S = null;
  function st() { return window.ZeikStore.state; }
  function render() { U.render(); }
  function esc(s) { return Z.esc(s); }
  function money(v) { return Z.fmtBRL(v); }
  function seg(id) { return U.segById(id); }
  function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
  function findProspect(id) { return byId(st().prospects, id); }
  function findDeal(id) { return byId(st().deals, id); }
  function findCliente(id) { return byId(st().clientes, id); }
  function findTarefa(id) { return byId(st().tarefas, id); }
  function findPag(id) { return byId(st().financeiro, id); }

  function readForm(root) {
    var o = {};
    root.querySelectorAll("[data-f]").forEach(function (el) {
      var k = el.getAttribute("data-f");
      if (el.type === "radio") { if (el.checked) o[k] = el.value; return; }   // grupo: só o marcado vale
      if (el.type === "checkbox") { o[k] = !!el.checked; return; }
      if (el.type === "number") { o[k] = el.value === "" ? "" : Number(el.value); return; }
      o[k] = (el.value || "").trim();
    });
    return o;
  }
  function fld(label, html) { return '<label class="field"><span class="lbl">' + esc(label) + '</span>' + html + '</label>'; }
  function inp(name, val, type, ph, extra) {
    return '<input type="' + (type || "text") + '" data-f="' + name + '" value="' + esc(val == null ? "" : val) + '" placeholder="' + esc(ph || "") + '" ' + (extra || "") + '>';
  }
  function sel(name, opts, cur) {
    return '<select data-f="' + name + '">' + opts.map(function (o) {
      return '<option value="' + esc(o.id != null ? o.id : o) + '"' + (String(cur) === String(o.id != null ? o.id : o) ? " selected" : "") + '>' + esc(o.nome != null ? o.nome : o) + '</option>';
    }).join("") + '</select>';
  }
  function txta(name, val, ph) { return '<textarea data-f="' + name + '" placeholder="' + esc(ph || "") + '">' + esc(val || "") + '</textarea>'; }

  /* ====================================================================== */
  /*  PROSPECÇÃO — CRUD                                                      */
  /* ====================================================================== */
  function whs_ok(i) { return i.tipo === "celular" || !i.dig; }
  var ZONAS = window.ZeikStore.ZONAS;   // as 5 zonas da cidade, definidas no store
  var SITE_OPTS = [{ id: "", nome: "— não sei / não tem" }, { id: "gratuito", nome: "🔴 site grátis (Wix/Canva/lojinha)" },
    { id: "google-sites", nome: "🔴 Google Sites (amador)" }, { id: "negocio_site", nome: "🔴 página grátis do Google (negocio.site)" },
    { id: "linktree", nome: "🟠 só Linktree / agregador" }, { id: "booksy", nome: "🟠 agenda no Booksy/inDrive-like" },
    { id: "instagram", nome: "🟠 só Instagram" }, { id: "proprio", nome: "🟢 site próprio decente" }];

  function prospectForm(p) {
    var cfg = st().config, bairros = cfg.bairros;
    var sgm = window.ZEIK_SEED.segmentos.map(function (g) { return { id: g.id, nome: g.emoji + " " + g.nome }; });
    return U.modalShell(
      p ? "Editar prospect" : "Novo prospect",
      p ? '<span class="badge gray">' + esc(p.origem || "manual") + '</span>' : "Cadastre agora o que você viu na rua — leva 20 segundos",
      '<div class="form-grid">' +
      '<label class="field full"><span class="lbl">Nome da empresa *</span>' + inp("nome", p && p.nome, "text", "Ex.: Barbearia do Zé") + '</label>' +
      fld("Pessoa do contato", inp("contato", p && p.contato, "text", "Dono / gerente — nome aumenta a conversão")) +
      fld("Segmento", sel("segmento", sgm, p && p.segmento || "generico")) +
      fld("Bairro", inp("bairro", p && p.bairro, "text", "Ex.: Tatuapé, Santana, Butantã… (autocomplete pela lista)")) +
      fld("Zona da cidade", sel("zona", ZONAS, (p && p.zona) || Z.zonaPorBairro(p && p.bairro))) +
      fld("WhatsApp (celular 11 9…)", inp("whats", p && (p.whats || p.telefone), "tel", "(11) 98765-4321 — só celular aceita WhatsApp")) +
      fld("Telefone fixo (só ligação)", inp("fixo", p && p.fixo, "tel", "(11) 5555-5555")) +
      fld("Endereço", inp("endereco", p && p.endereco, "text", "Rua, número")) +
      fld("Site hoje", sel("siteAtual", SITE_OPTS, p && p.siteAtual)) +
      fld("Prioridade", sel("prioridade", [{ id: "alta", nome: "🔥 Alta" }, { id: "media", nome: "Média" }, { id: "baixa", nome: "Baixa" }], p && p.prioridade || "media")) +
      fld("Status", sel("status", Object.keys(App.STATUS_LABEL).map(function (k) { return { id: k, nome: App.STATUS_LABEL[k][0] }; }), p && p.status || "novo")) +
      '<label class="field"><span class="lbl">Tem site?</span>' + sel("temSite", [{ id: "nao", nome: "Não (venda fácil)" }, { id: "sim", nome: "Sim" }, { id: "?", nome: "Não sei / checar" }], p ? (p.temSite === false ? "nao" : p.temSite === true ? "sim" : "?") : "nao") + '</label>' +
      '<label class="field"><span class="lbl">Tem Instagram?</span>' + sel("temInstagram", [{ id: "nao", nome: "Não (venda o combo)" }, { id: "sim", nome: "Sim" }, { id: "?", nome: "Não sei / checar" }], p ? (p.temInstagram === false ? "nao" : p.temInstagram === true ? "sim" : "?") : "?") + '</label>' +
      fld("Instagram (se tiver)", inp("insta", p && p.insta, "text", "@perfil")) +
      fld("Ticket médio do negócio (R$)", inp("ticket", p && p.ticket, "number", "Ex.: 55")) +
      '<label class="field full"><span class="lbl">Observações / gancho de venda</span>' + txta("obs", p && p.obs, "Fachada nova, movimento alto, concorrência direta, quem decide…") + '</label>' +
      '</div>',
      (p ? '<button class="btn red quiet" data-act="p-del" data-id="' + p.id + '" style="margin-right:auto">🗑 Apagar</button>' : "") +
      '<button class="btn quiet" data-close>Cancelar</button>' +
      '<button class="btn" data-save>' + (p ? "Salvar alterações" : "Adicionar à lista") + '</button>'
    );
  }

  App.modalProspect = function (id) {
    var p = id ? findProspect(id) : null;
    var ov = U.openModal(prospectForm(p), { wide: true });
    // bairro → zona automática (ele só digita o bairro)
    var bEl = ov.querySelector('[data-f="bairro"]'), zEl = ov.querySelector('[data-f="zona"]');
    function syncZona() {
      if (!bEl || !zEl) return;
      var z = Z.zonaPorBairro(bEl.value);
      if (!z) return;
      for (var i = 0; i < zEl.options.length; i++) if (zEl.options[i].value === z) { zEl.value = z; break; }
    }
    if (bEl) { bEl.addEventListener("input", syncZona); bEl.addEventListener("change", syncZona); if (!p) syncZona(); }
    ov.querySelector("[data-save]").addEventListener("click", function () {
      var v = readForm(ov);
      if (!v.nome) { U.toast("Dê um nome pra empresa.", "err"); return; }
      var infoW = Z.foneInfo(v.whats), infoF = Z.foneInfo(v.fixo);
      var whats = infoW.tipo === "celular" ? infoW.display : (infoW.tipo === "invalido" ? v.whats : "");
      var fixo = infoF.display || "";
      // celular digitado no campo do fixo: vira WhatsApp automaticamente
      if (!whats && infoF.tipo === "celular") { whats = infoF.display; fixo = ""; }
      if (infoW.tipo === "fixo") {
        U.toast("⚠️ “" + infoW.display + "” tem 8 dígitos depois do DDD → é telefone FIXO, não abre WhatsApp. Guardamos em “Telefone fixo” e deixamos o WhatsApp vazio.", "warn", 9000);
      }
      var data = {
        nome: v.nome, contato: v.contato, segmento: v.segmento, bairro: v.bairro,
        zona: v.zona || Z.zonaPorBairro(v.bairro),
        whats: whats, telefone: whats, fixo: fixo, siteAtual: v.siteAtual || "",
        busca: whats ? "" : (v.nome + " " + v.bairro + " São Paulo"),
        endereco: v.endereco, prioridade: v.prioridade, status: v.status,
        temSite: v.temSite === "nao" ? false : v.temSite === "sim" ? true : null,
        temInstagram: v.temInstagram === "nao" ? false : v.temInstagram === "sim" ? true : null,
        insta: v.insta, obs: v.obs,
        ticket: Number(v.ticket) || 0,
        atualizadoEm: new Date().toISOString()
      };

  function precosProposta(deal, cliente) {
    var cfg = st().config;
    var itens = (deal && deal.itens) || (cliente && cliente.itens) || { site: true, insta: true, gmn: false, manut: false };
    var linhas = [];
    var total = 0;
    if (itens.site) { var pv = Number(deal && deal.valor) || cfg.precoSite; linhas.push({ nome: "Site profissional (landing + páginas de serviços)", valor: pv }); total += pv; }
    if (itens.insta) { linhas.push({ nome: "Criação do Instagram OU organização de feed + destaques", valor: cfg.precoInsta }); total += cfg.precoInsta; }
    if (itens.gmn) { linhas.push({ nome: "Google Meu Negócio configurado (endereço, fotos, avaliações)", valor: cfg.precoGmn }); total += cfg.precoGmn; }
    if (itens.manut) { linhas.push({ nome: "Manutenção mensal (alterações, backup, suporte)", valor: cfg.manutMes, mensal: true }); }
    if (!linhas.length) { total = cfg.precoSite; linhas.push({ nome: "Site profissional", valor: cfg.precoSite }); }
    return { linhas: linhas, total: total, itens: itens };
  }

  function gerarTextoProposta(nomeEmpresa, d, ctx) {
    var cfg = st().config;
    var P = precosProposta(d);
    var hoje = new Date();
    var validade = new Date(hoje.getTime() + 5 * 86400000);
    var l = [];
    l.push("*" + (d && d.tituloProposta || "PROPOSTA — " + nomeEmpresa.toUpperCase()) + "*");
    l.push(cfg.agencia + " · " + cfg.cidade);
    l.push(hoje.toLocaleDateString("pt-BR") + " · válida até " + validade.toLocaleDateString("pt-BR"));
    l.push("");
    if (d.contato) l.push(d.contato + ", tudo bem?");
    l.push("Conforme conversamos, " + nomeEmpresa + " foi analisado por aqui: pesquisa de mercado no bairro + concorrência online. O diagnóstico abaixo é o que eu faria.");
    l.push("");
    l.push("*1. O QUE EU VI*");
    l.push(ctx.diagnostico);
    l.push("");
    l.push("*2. O QUE EU ENTREGO*");
    P.linhas.forEach(function (x, i) {
      l.push((i + 1) + ") " + x.nome + " — " + money(x.valor) + (x.mensal ? "/mês" : ""));
      l.push("   " + (DETALHE[x.nome] || "Feito à mão, no seu estilo, com textos revisados."));
    });
    l.push("");
    l.push("*3. PRAZO*");
    l.push("Começo após o OK e o envio do material (fotos, textos, logo). Entrega em " + cfg.prazoEntrega + ".");

  App.modalScript = function (p) {
    var g = seg(p.segmento);
    var ctx = U.scriptCtx({
      p: p,
      empresa: p.nome, contato: p.contato || "chefe", bairro: p.bairro, segmento: (g.nome || "").toLowerCase(),
      servico: (g.nome || "").split(" /")[0].toLowerCase()
    });
    /* v6: a primeira mensagem e o gatilho vêm dos ROTEIROS que você modelou
       (config.rota); os demais campos vêm do playbook do segmento. */
    var abas = [["m1", "1ª mensagem"], ["gatilho", "⚡ Gatilho (2ª)"], ["script", "Script do segmento"], ["followup", "Follow-up"], ["fechamento", "Fechamento"]];
    var cur = { i: 0 };

    function texto() {
      var k = abas[cur.i][0];
      var rn = Z.rotaPara && ctx.p ? Z.rotaPara(ctx.p, k, st().config) : "";
      var rota = (st().config.rota || {})[k];
      if (k === "m1" || k === "gatilho") return U.fillVars(rn || rota || g.script, Object.assign({}, ctx, { rota: k }));
      return U.fillVars(g[k] || g.script, Object.assign({}, ctx, { rota: k }));
    }
    function render2() {
      var body = ov.querySelector("[data-corpo]");
      body.innerHTML = '<div class="script-box" style="max-height:300px">' + esc(texto()) + '</div>' +
        '<div class="row wrap" style="margin-top:10px">' +
        abas.map(function (a, i) { return '<button class="btn xs ' + (i === cur.i ? "" : "quiet") + '" data-tab="' + i + '">' + a[1] + '</button>'; }).join("") +
        '<button class="btn xs quiet" data-falar>🔊 Ouvir</button>' +
        '<button class="btn xs quiet" data-copia-agora>⧉ Copiar</button>' +
        '<span class="tiny" style="margin-left:auto">' + esc(p.temSite === false ? "🌐 Sem site = argumento forte" : p.temSite === true ? "🌐 Tem site: venda velocidade/Google" : "🌐 Checar site antes") +
        ' · ' + esc(p.temInstagram === false ? "📷 Sem Instagram = combo fechado" : "📷 Instagram " + (p.insta || "a verificar")) + '</span>' +
        '</div>';
      body.querySelectorAll("[data-tab]").forEach(function (b) {
        b.addEventListener("click", function () { cur.i = Number(b.getAttribute("data-tab")); render2(); });
      });
      var fb = body.querySelector("[data-falar]");
      if (fb) fb.addEventListener("click", function () { U.falar(texto(), { botao: fb, forcar: true }); });
      var cb = body.querySelector("[data-copia-agora]");
      if (cb) cb.addEventListener("click", function () { U.copy(texto(), "Copiada a " + abas[cur.i][1] + " — adapte 1 linha antes de mandar."); });
    }
    var ov = U.openModal(U.modalShell("🧠 Script — " + p.nome,
      "Personalizado com o nome da empresa, o bairro e o seu preço. Leia antes de mandar: adapte 1 linha e a resposta muda.",
      '<div data-corpo></div>' +
      '<hr class="hr"><div class="row wrap" style="gap:8px">' +
      '<button class="btn sm ghost" data-act="edit-note">✍️ Ajustar texto</button>' +
      '<span class="tiny">Se a empresa for muito quente, ligue em vez de mandar texto frio.</span></div>',
      '<button class="btn quiet" data-close>Fechar</button>' +
      '<button class="btn ghost" data-act="copiar-texto" data-sel="[data-corpo] .script-box">⧉ Copiar</button>' +

  App.gerarSite = function (preview) {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
    var base = g("g-base");
    var d = {
      empresa: g("g-empresa") || "Sua Empresa",
      bairro: g("g-bairro") || "São Paulo",
      endereco: g("g-end"), telefone: g("g-tel"), horarios: g("g-hor"), sobre: g("g-sobre"),

      estilo: g("g-estilo"), instagram: g("g-insta"),
      nota: g("g-nota"), avaliacoes: g("g-aval")
    };
    if (base) {
      var kind = base[0], id = base.slice(2);
      var src = kind === "c" ? findCliente(id) : findDeal(id);
      if (src) {
        var fromSrc = {
          empresa: src.empresa, bairro: src.bairro || "", endereco: src.endereco || "",
          telefone: src.telefone || "", segmento: src.segmento || "generico",
          instagram: (src.insta || "").replace("@", ""),
          sobre: src.obs && !d.sobre ? src.obs : d.sobre
        };
        // o que o usuário digitou no formulário vence; o que está vazio vem do cadastro
        Object.keys(fromSrc).forEach(function (k) { if (!d[k] || d[k] === "Sua Empresa" || d[k] === "São Paulo") d[k] = fromSrc[k]; });
        if (!d.bairro && src.bairro) d.bairro = src.bairro;
      }
    }
    if (!Z.onlyDigits(d.telefone)) {
      U.toast("Sem telefone/WhatsApp o botão não funciona — preencha o telefone.", "warn");
    }
    var html = window.ZeikSite.gerar(Object.assign({}, d, {
      telefoneFmt: d.telefone ? Z.fmtTel(d.telefone) : "",
      whatsapp: Z.toWa(d.telefone) || st().config.whatsapp
    }));
    if (preview) {
      var host = document.getElementById("sitePrev");
      host.innerHTML = '<div class="card" style="padding:0;overflow:hidden"><div class="row between" style="padding:12px 16px;border-bottom:1px solid var(--hairline)">' +
        '<div class="card-title" style="margin:0">👁 Prévia — ' + esc(d.empresa) + '</div>' +
        '<button class="btn xs" data-act="baixar-site" >⬇ Baixar HTML</button></div>' +
        '<iframe style="width:100%;height:62vh;border:0;background:#fff" srcdoc="' + esc(html) + '" title="Prévia do site"></iframe></div>';
      host.dataset.html = html; host.dataset.name = slug(d.empresa) + ".html";
      host.scrollIntoView({ behavior: "smooth", block: "start" });
      U.toast("Prévia gerada. Role para baixo — e teste o botão de WhatsApp.", "ok");
      return;
    }
    window.ZeikSite.baixar(slug(d.empresa) + ".html", html);
    S.log("site", "Gerou site para " + d.empresa, null);
    S.save();
  };
  function csvCell(x) {
    var v = String(x == null ? "" : x).replace(/"/g, '""').replace(/[\r\n]+/g, " ");
    return '"' + v + '"';
  }
  function slug(s) {
    return String(s || "site").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "site";
  }

  App.exportCSV = function () {
    var s = st(), lines = [];

    lines.push(head);
    s.prospects.forEach(function (p) {
      lines.push([p.nome, p.contato, seg(p.segmento).nome, p.zona || "", p.bairro, p.endereco,
      p.whats || p.telefone || "", p.fixo || "", (App.STATUS_LABEL[p.status] || [""])[0], p.prioridade,
      p.temSite === false ? "não" : p.temSite ? "sim" : "?", (Z.SITE_ATUAL || {})[p.siteAtual] || (p.temSite ? "próprio" : ""),
      p.temInstagram === false ? "não" : p.temInstagram ? "sim" : "?", (p.obs || "")]
        .map(csvCell).join(";"));
    });
    var csvCli = "\n# CLIENTES\nempresa;contato;segmento;bairro;telefone;valor;status;manutencao;entregue\n";
    s.clientes.forEach(function (c) {
      csvCli += [c.empresa, c.contato, seg(c.segmento).nome, c.bairro, c.telefone, c.valor, c.status, c.manutencao ? "sim" : "não", c.entregue || ""]
        .map(csvCell).join(";") + "\n";
    });
    var csvFin = "\n# FINANCEIRO\ndata;descricao;tipo;valor;status\n";
    s.financeiro.forEach(function (f) { csvFin += [f.data, f.descricao || "", f.tipo, f.valor, f.status].map(csvCell).join(";") + "\n"; });
    U.download("zeik-zona-sul-" + Z.todayISO() + ".csv", "\ufeff" + lines.join("\n") + csvCli + csvFin, "text/csv");
  };
